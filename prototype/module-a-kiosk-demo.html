<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediKiosk — Module A History Kiosk (SIH demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6E66'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E" />
<!--
  MediKiosk Module A — interactive SIH demo prototype (single file, runs offline).

  HOW TO RUN: open this file in any modern browser (double-click). No server, no internet needed.

  WHAT THIS IS: a 90-second demo of the patient history-capture flow and its deterministic
  safety layer. Speech input uses the browser microphone when available; text remains the fallback. This demo keeps concise clinical excerpts only.

  INLINED LIBRARIES (all MIT-licensed, embedded so the file works with zero network):
    - React 18.3.1 UMD production build  (facebook/react, MIT)
    - ReactDOM 18.3.1 UMD production build (facebook/react, MIT)
    - htm 3.1.1 UMD (developit/htm, MIT)
  Everything else is MediKiosk demo code. See doc/12-prototype-demo.md in the project repo.
-->
<style>
:root{
  --bg:#F4F1EA;
  --surface:#FFFFFF;
  --surface2:#FBFAF6;
  --ink:#1D2B32;
  --muted:#5D6E74;
  --line:#E3DDCE;
  --line2:#D2CBB8;
  --teal:#0E6E66;
  --teal-d:#0A544E;
  --teal-dd:#083F3B;
  --teal-bg:#E4F1EF;
  --teal-line:#AFD9D3;
  --red:#B42318;
  --red-d:#8E1B12;
  --red-bg:#FDECE7;
  --red-line:#EFB4A6;
  --amber:#96620F;
  --amber-bg:#FBF1DC;
  --amber-line:#E8D3A6;
  --ok:#1B7A43;
  --ok-bg:#E5F4EA;
  --radius:18px;
  --shadow:0 2px 10px rgba(29,43,50,.07), 0 14px 36px rgba(29,43,50,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Nirmala UI","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
#root{min-height:100vh;display:flex;flex-direction:column}

/* ============ demo controls bar (presenter only) ============ */
.demobar{
  background:#232B2F;color:#C9D2D6;
  border-bottom:3px dashed #4A585F;
  font-size:12.5px;
  padding:7px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:0;z-index:60;
}
.demobar .dbTitle{font-weight:700;letter-spacing:.06em;color:#EDD9A3;white-space:nowrap}
.demobar .dbBtn{
  background:transparent;color:#DCE4E8;
  border:1.5px solid #4A585F;border-radius:8px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;
}
.demobar .dbBtn:hover{background:#34404A}
.demobar .dbSpacer{flex:1}
.demobar .dbNote{color:#93A3AB}
.demobar .dbTimer{font-variant-numeric:tabular-nums;color:#EDD9A3;font-weight:600}

/* ============ header ============ */
.hdr{
  background:linear-gradient(100deg,var(--teal-dd),var(--teal-d) 55%,var(--teal));
  color:#fff;
  padding:14px 22px;
}
.hdrInner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandMark{
  width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:300;color:#fff;flex:none;
}
.brandTxt h1{font-size:1.35rem;font-weight:700;letter-spacing:.01em}
.brandTxt .sub{font-size:.8rem;opacity:.85;margin-top:1px}
.hdrChips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hdrChip{
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  color:#fff;border-radius:999px;padding:5px 13px;font-size:.78rem;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.hdrChip .dot{width:8px;height:8px;border-radius:50%;background:#7BE3B0;display:inline-block}
.hdrChip.demoChip{background:rgba(255,255,255,.9);color:var(--teal-dd);border-color:#fff}

/* urgent strip under header once a flag is active */
.urgentStrip{
  background:var(--red);color:#fff;
  padding:9px 22px;font-weight:600;font-size:.92rem;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.urgentStrip .usBadge{background:#fff;color:var(--red);border-radius:8px;padding:2px 10px;font-weight:800;font-size:.8rem;letter-spacing:.04em}
.urgentStrip .usRight{margin-left:auto;font-weight:500;opacity:.95;font-size:.82rem}

/* ============ stage layout ============ */
.stage{
  max-width:1240px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;
  padding:22px 22px 70px;align-items:start;flex:1;
}

/* ============ progress rail ============ */
.rail{position:sticky;top:96px;display:flex;flex-direction:column;gap:8px}
.railTitle{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:2px 4px 4px}
.railItem{
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:10px 13px;
  font-size:.9rem;color:var(--muted);
}
.railItem .rDot{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--bg);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;color:var(--muted);
}
.railItem.done{color:var(--teal-d);border-color:var(--teal-line);background:var(--teal-bg)}
.railItem.done .rDot{background:var(--teal);border-color:var(--teal);color:#fff}
.railItem.current{color:var(--ink);border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,110,102,.12);font-weight:600}
.railItem.current .rDot{border-color:var(--teal);color:var(--teal)}
.railItem.flagged{border-color:var(--red-line);background:var(--red-bg);color:var(--red-d)}
.railItem.flagged .rDot{background:var(--red);border-color:var(--red);color:#fff}
.railItem .rLab{line-height:1.25}
.railItem .rLab .rLabHi{display:block;font-size:.76rem;color:inherit;opacity:.75}
.railSub{font-size:.74rem;color:var(--muted);margin:-3px 4px 4px;padding-left:2px}

/* ============ conversation log ============ */
.logCol{display:flex;flex-direction:column;gap:16px;min-width:0}
.log{
  background:var(--surface2);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;max-height:32vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.logEmpty{color:var(--muted);font-size:.9rem;text-align:center;padding:8px 0}
.msg{max-width:88%;font-size:.92rem}
.msg .mWho{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;opacity:.7}
.msg.kiosk{align-self:flex-start}
.msg.kiosk .mBody{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--teal);border-radius:4px 14px 14px 14px;padding:9px 13px}
.msg.patient{align-self:flex-end;text-align:right}
.msg.patient .mBody{background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:14px 4px 14px 14px;padding:9px 13px;display:inline-block;text-align:left}
.msg.patient .mMeta{font-size:.72rem;color:var(--muted);margin-top:3px}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .mBody{
  background:var(--amber-bg);border:1.5px solid var(--amber-line);border-radius:999px;
  padding:6px 15px;font-size:.82rem;color:var(--amber);font-weight:600;text-align:center;
}
.msg.sys.sysRed .mBody{background:var(--red-bg);border-color:var(--red-line);color:var(--red-d)}
.msg.sys.sysOk .mBody{background:var(--ok-bg);border-color:#BCE3C9;color:var(--ok)}

/* ============ current question card ============ */
.card{
  background:var(--surface);border:2px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);
  padding:26px 28px 24px;
}
.stepTag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--teal);background:var(--teal-bg);
  border:1.5px solid var(--teal-line);border-radius:999px;
  padding:4px 13px;margin-bottom:14px;
}
.prompt{font-size:1.5rem;font-weight:600;line-height:1.32}
.promptSub{font-size:1.04rem;color:var(--muted);margin-top:6px;line-height:1.4}
.speakBtn{
  margin-left:10px;background:transparent;border:1.5px solid var(--teal-line);
  color:var(--teal);border-radius:999px;font-size:.72rem;font-weight:700;
  padding:4px 12px;cursor:pointer;vertical-align:middle;
}
.speakBtn:hover{background:var(--teal-bg)}
.speakWrap{display:inline-block;vertical-align:middle;margin-left:10px}
.speakNote{display:block;font-size:.7rem;color:var(--muted);margin-top:4px;max-width:360px;line-height:1.35}
.voiceTag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;color:var(--teal-d);background:var(--teal-bg);
  border:1.5px dashed var(--teal-line);border-radius:8px;padding:3px 10px;margin-top:12px;
}
.voiceTag b{font-weight:700}

.chipGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:20px}
.chip{
  background:#fff;border:2px solid var(--line2);
  border-radius:15px;padding:13px 15px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:3px;position:relative;min-height:64px;justify-content:center;
  transition:border-color .12s, background .12s, transform .05s;
}
.chip:hover{border-color:var(--teal);background:var(--surface2)}
.chip:active{transform:scale(.985)}
.chip .cEn{font-size:1rem;font-weight:600;line-height:1.25}
.chip .cHi{font-size:.85rem;color:var(--muted);line-height:1.3}
.chip.suggested::after{
  content:"demo script";
  position:absolute;top:-10px;right:10px;
  background:var(--teal);color:#fff;font-size:.64rem;font-weight:800;letter-spacing:.06em;
  border-radius:999px;padding:2px 9px;text-transform:uppercase;
}
.chip.selected{background:var(--teal-bg);border-color:var(--teal)}
.chip.selExcl{opacity:.55}
.yesNoRow{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.yesNoRow .chip{min-width:150px;flex:1;text-align:center;align-items:center}

.scaleGrid{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin-top:20px}
.scaleBtn{
  border:2px solid var(--line2);background:#fff;border-radius:12px;
  font-size:1.15rem;font-weight:700;padding:14px 0;cursor:pointer;color:var(--ink);
}
.scaleBtn:hover{border-color:var(--teal)}
.scaleBtn.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.scaleHint{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px}
.scaleGo{margin-top:16px}

.orDiv{display:flex;align-items:center;gap:12px;margin:18px 0 10px;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.05em}
.orDiv::before,.orDiv::after{content:"";flex:1;border-top:2px dashed var(--line2)}

.inputRow{display:flex;gap:10px;align-items:stretch}
.inputRow textarea{
  flex:1;font-family:inherit;font-size:1.02rem;color:var(--ink);
  border:2px solid var(--line2);border-radius:14px;padding:12px 14px;resize:vertical;min-height:58px;
  background:var(--surface2);
}
.inputRow textarea:focus{outline:3px solid rgba(14,110,102,.25);border-color:var(--teal)}
.voiceStatus{margin-top:7px;color:var(--muted);font-size:.82rem;line-height:1.35}
.voiceBtn{background:var(--teal-d)}
.btn{
  background:var(--teal);color:#fff;border:none;border-radius:14px;
  font-size:1rem;font-weight:700;padding:12px 24px;cursor:pointer;min-height:54px;
}
.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--line2);cursor:not-allowed}
.btn.ghost{
  background:transparent;color:var(--teal-d);border:2px solid var(--teal-line);
}
.btn.ghost:hover{background:var(--teal-bg)}
.btn.big{font-size:1.12rem;padding:16px 30px;min-height:64px}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:var(--red-d)}
.btnRow{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.skipLink{
  background:none;border:none;color:var(--muted);font-size:.85rem;text-decoration:underline;
  cursor:pointer;margin-top:16px;padding:4px 2px;
}
.skipLink:hover{color:var(--ink)}
.exampleBtn{
  background:var(--surface2);border:1.5px dashed var(--teal-line);color:var(--teal-d);
  border-radius:12px;padding:10px 14px;font-size:.9rem;cursor:pointer;text-align:left;
}
.exampleBtn:hover{background:var(--teal-bg)}
.exampleBtn .xTag{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:3px}

.detailRow{margin-top:14px}
.detailRow label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:6px}
.detailRow textarea{width:100%;font-family:inherit;font-size:.95rem;border:2px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:46px;background:var(--surface2)}

/* ============ cc card ============ */
.ccBox{
  background:var(--teal-bg);border:2px solid var(--teal-line);border-radius:16px;
  padding:16px 18px;margin-top:18px;
}
.ccBox .ccLbl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.ccBox .ccVal{font-size:1.4rem;font-weight:700;margin-top:4px}
.ccBox .ccHi{color:var(--teal-d);opacity:.85}

/* ============ safety ============ */
.safetyNote{
  margin-top:14px;font-size:.8rem;color:var(--muted);
  background:var(--surface2);border:1.5px dashed var(--line2);border-radius:10px;padding:9px 12px;
}
.overlay{
  position:fixed;inset:0;z-index:90;overflow:auto;
  background:rgba(96,16,9,.45);
  padding:4vh 16px 8vh;
  display:flex;justify-content:center;align-items:flex-start;
}
.alertCard{
  width:100%;max-width:900px;background:#fff;border-radius:24px;overflow:hidden;
  border:3px solid var(--red);box-shadow:0 30px 80px rgba(90,10,5,.4);
}
.alertHead{background:var(--red);color:#fff;padding:26px 30px}
.alertHead .ahTag{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.alertHead h2{font-size:1.7rem;font-weight:800;margin-top:4px;line-height:1.25}
.alertHead .ahHi{font-size:1.12rem;margin-top:4px;opacity:.95}
.alertHead .ahWhy{
  margin-top:14px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);
  border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.4;
}
.alertBody{padding:24px 30px 28px}
.ruleList{display:flex;flex-direction:column;gap:10px}
.rule{
  border:2px solid var(--line);border-radius:14px;padding:12px 16px;
  display:flex;gap:12px;align-items:flex-start;background:var(--surface2);
}
.rule .rId{
  font-size:.7rem;font-weight:800;letter-spacing:.06em;border-radius:7px;
  padding:3px 8px;flex:none;margin-top:2px;background:var(--line);color:var(--muted);
}
.rule .rTxt{font-size:.95rem;line-height:1.35}
.rule .rStatus{font-size:.78rem;font-weight:700;margin-top:3px;color:var(--muted)}
.rule.matched{border-color:var(--red);background:var(--red-bg)}
.rule.matched .rId{background:var(--red);color:#fff}
.rule.matched .rTxt{font-weight:700;color:var(--red-d)}
.rule.matched .rStatus{color:var(--red);font-weight:800}
.evidence{
  background:#fff;border:1.5px dashed var(--red-line);border-radius:10px;
  padding:8px 12px;margin-top:8px;font-size:.86rem;
}
.evidence b{font-weight:700}
.alertInstruction{
  margin-top:20px;background:var(--red-bg);border:2px solid var(--red-line);
  border-radius:16px;padding:18px 20px;
}
.alertInstruction .aiBig{font-size:1.25rem;font-weight:700;line-height:1.35}
.alertInstruction .aiHi{font-size:1.05rem;color:var(--red-d);margin-top:4px}
.alertInstruction .aiMeta{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.aiPill{
  background:#fff;border:1.5px solid var(--red-line);color:var(--red-d);
  font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 13px;
}
.alertActions{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.alertActions .aaNote{font-size:.8rem;color:var(--muted)}

.safetyOk{
  border:2px solid var(--teal-line);background:var(--teal-bg);border-radius:20px;padding:24px 26px;
}
.safetyOk h3{font-size:1.3rem;color:var(--teal-dd)}
.safetyOk .soHi{color:var(--teal-d);font-size:1.02rem;margin-top:2px}

/* ============ welcome ============ */
.welcome{max-width:980px;margin:0 auto;padding:34px 22px 70px;width:100%}
.wHero{text-align:center;margin-bottom:26px}
.wHero .wKicker{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.wHero h2{font-size:2rem;font-weight:800;margin-top:8px;line-height:1.25}
.wHero .wSub{font-size:1.05rem;color:var(--muted);margin-top:10px;max-width:640px;margin-left:auto;margin-right:auto}
.wCard{
  background:var(--surface);border:2px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);padding:28px 30px;
}
.wLabel{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.wLabel:first-child{margin-top:0}
.langRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.langTile{
  border:2px solid var(--line2);border-radius:16px;background:#fff;padding:16px;
  cursor:pointer;text-align:center;
}
.langTile .lMain{font-size:1.15rem;font-weight:700}
.langTile .lSub{font-size:.82rem;color:var(--muted);margin-top:3px}
.langTile.sel{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 4px rgba(14,110,102,.12)}
.scriptRow{display:flex;flex-direction:column;gap:12px}
.scriptCard{
  border:2px solid var(--line2);border-radius:16px;background:#fff;padding:15px 18px;
  cursor:pointer;display:flex;gap:14px;align-items:flex-start;text-align:left;
}
.scriptCard.sel{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 4px rgba(14,110,102,.12)}
.scriptCard .scDot{
  width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);flex:none;margin-top:3px;
  background:#fff;
}
.scriptCard.sel .scDot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3.5px #fff}
.scriptCard .scT{font-size:1.02rem;font-weight:700}
.scriptCard .scD{font-size:.88rem;color:var(--muted);margin-top:3px;line-height:1.4}
.scriptCard .scFlag{
  display:inline-block;background:var(--red-bg);border:1.5px solid var(--red-line);color:var(--red-d);
  font-size:.68rem;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:8px;
  letter-spacing:.05em;vertical-align:2px;
}
.wStart{display:flex;justify-content:center;margin-top:26px}
.wToken{
  margin-top:20px;font-size:.82rem;color:var(--muted);text-align:center;
}
.wToken code{background:var(--surface2);border:1.5px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.82rem}
.honestyBox{
  margin-top:22px;background:var(--amber-bg);border:2px solid var(--amber-line);
  border-radius:16px;padding:15px 19px;font-size:.88rem;color:#6B4A10;line-height:1.5;
}
.honestyBox b{font-weight:800}
.honestyBox .hbT{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;margin-bottom:5px;color:var(--amber)}
.ayushNote{
  margin-top:14px;font-size:.82rem;color:var(--muted);background:var(--surface2);
  border:1.5px dashed var(--line2);border-radius:12px;padding:10px 14px;line-height:1.45;
}

/* ============ read-back / summary ============ */
.sumWrap{max-width:1020px;margin:0 auto;padding:26px 22px 80px;width:100%}
.sumHead{text-align:center;margin-bottom:22px}
.sumHead h2{font-size:1.75rem;font-weight:800}
.sumHead .shHi{font-size:1.15rem;color:var(--teal-d);margin-top:2px}
.sumHead .shSub{color:var(--muted);margin-top:8px;font-size:.98rem;max-width:620px;margin-left:auto;margin-right:auto}
.sumFlagBanner{
  margin:0 0 18px;background:var(--red);color:#fff;border-radius:16px;padding:14px 20px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700;
}
.sumFlagBanner .fbTag{background:#fff;color:var(--red);border-radius:8px;padding:3px 11px;font-weight:800;font-size:.78rem;letter-spacing:.05em}
.sumSection{
  background:var(--surface);border:2px solid var(--line);border-radius:20px;
  padding:18px 22px;margin-bottom:16px;
}
.sumSection h3{font-size:1.06rem;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sumSection h3 .ssHi{font-size:.9rem;color:var(--muted);font-weight:600}
.sumRow{
  display:flex;gap:14px;padding:11px 0;border-bottom:1.5px dashed var(--line);
  align-items:flex-start;
}
.sumRow:last-child{border-bottom:none}
.srLab{width:200px;flex:none;font-size:.88rem;color:var(--muted);line-height:1.35;padding-top:2px}
.srLab .srLabHi{display:block;font-size:.76rem;opacity:.8}
.srVal{flex:1;min-width:0}
.srVal .vTxt{font-size:1.02rem;font-weight:600;line-height:1.35}
.srVal .vQuote{
  font-size:.85rem;color:var(--muted);font-style:italic;margin-top:3px;line-height:1.4;
}
.srVal .vQuote::before{content:"„ "}
.srVal .vQuote::after{content:" “"}
.srVal .vSrc{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);margin-top:4px;display:inline-block}
.srSide{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.badge{font-size:.7rem;font-weight:800;border-radius:999px;padding:3px 11px;letter-spacing:.03em;white-space:nowrap}
.badge.cap{background:var(--ok-bg);color:var(--ok);border:1.5px solid #BCE3C9}
.badge.rev{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-line)}
.badge.na{background:var(--bg);color:var(--muted);border:1.5px solid var(--line2)}
.badge.urgent{background:var(--red);color:#fff;border:1.5px solid var(--red)}
.chgBtn{
  background:none;border:1.5px solid var(--teal-line);color:var(--teal-d);
  border-radius:9px;font-size:.75rem;font-weight:700;padding:4px 11px;cursor:pointer;
}
.chgBtn:hover{background:var(--teal-bg)}
.sumConfirm{
  position:sticky;bottom:14px;
  background:var(--teal-dd);border-radius:20px;padding:16px 20px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  box-shadow:0 18px 44px rgba(8,63,59,.45);
}
.sumConfirm .scMsg{color:#fff;font-size:.95rem;font-weight:600;flex:1;min-width:220px}
.sumConfirm .scMsg .hi{display:block;font-size:.85rem;opacity:.85;font-weight:400}

/* ============ handoff (physician view) ============ */
.hoWrap{max-width:980px;margin:0 auto;padding:26px 22px 80px;width:100%}
.hoSheet{
  background:#fff;border:2px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);
}
.hoHead{background:var(--surface2);border-bottom:2px solid var(--line);padding:16px 24px}
.hoHead .hoT{font-size:1.2rem;font-weight:800}
.hoHead .hoMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.hoPill{
  font-size:.72rem;font-weight:700;border-radius:999px;padding:4px 12px;
  background:var(--bg);border:1.5px solid var(--line2);color:var(--muted);
}
.hoPill.pri{background:var(--red);border-color:var(--red);color:#fff}
.hoPill.ok{background:var(--ok-bg);border-color:#BCE3C9;color:var(--ok)}
.hoBanner{
  background:var(--red-bg);border-bottom:2px solid var(--red-line);color:var(--red-d);
  padding:12px 24px;font-size:.92rem;font-weight:600;line-height:1.45;
}
.hoBody{padding:8px 24px 22px}
.hoSec{padding:14px 0 4px;border-bottom:1.5px solid var(--line)}
.hoSec:last-child{border-bottom:none}
.hoSec h4{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-d);margin-bottom:8px}
.hoRow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:6px 0;font-size:.92rem;align-items:baseline}
.hoRow .hK{color:var(--muted);font-weight:600;font-size:.84rem}
.hoRow .hV{font-weight:500;line-height:1.4}
.hoRow .hV .vQuote{display:block;font-size:.8rem;color:var(--muted);font-style:italic}
.hoRow .hSrc{font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal);white-space:nowrap}
.hoDq{font-size:.82rem;color:var(--muted);font-style:italic}
.locked{
  border:2px dashed var(--line2);border-radius:14px;padding:14px 18px;margin-top:6px;
  background:var(--surface2);color:var(--muted);font-size:.9rem;line-height:1.45;
}
.locked b{color:var(--ink)}
.locked .lkTag{
  display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.08em;
  background:var(--line);color:var(--muted);border-radius:7px;padding:2px 9px;margin-bottom:6px;
  text-transform:uppercase;
}
.hoFoot{
  border-top:2px solid var(--line);background:var(--surface2);padding:13px 24px;
  font-size:.76rem;color:var(--muted);line-height:1.5;
}
.hoActions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center}

/* footer note */
.stageFoot{
  text-align:center;color:var(--muted);font-size:.78rem;padding:0 22px 26px;max-width:1020px;margin:0 auto;
}

/* ============ responsive ============ */
@media (max-width:980px){
  .stage{grid-template-columns:1fr;padding:14px 14px 60px}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:8px}
  .railTitle{display:none}
  .railItem{flex:none;min-width:max-content;padding:8px 11px;font-size:.82rem}
  .railItem .rLab .rLabHi{display:none}
  .railSub{display:none}
  .prompt{font-size:1.28rem}
  .srLab{width:130px}
  .hoRow{grid-template-columns:110px 1fr;row-gap:2px}
  .hoRow .hSrc{grid-column:2}
  .card{padding:20px 18px}
  .scaleGrid{grid-template-columns:repeat(6,1fr)}
}
</style>

function foundTerms(corpus, terms) {
  var out = [];
  for (var i = 0; i < terms.length; i++) {
    if (corpus.indexOf(terms[i]) !== -1) out.push(terms[i]);
  }
  return out;
}

function severityInCorpus(corpus) {
  return /(8|9|10)\s*(\/|out of)\s*(10)/.test(corpus);
}

function runSafetyCheck(corpus, severityValue) {
  var c = String(corpus || "").toLowerCase();
  var hits = [];
  var all = [];
  for (var i = 0; i < RED_FLAG_RULES.length; i++) {
    var rule = RED_FLAG_RULES[i];
    var matched = false;
    var evidence = [];
    if (rule.kind === "and") {
      matched = true;
      for (var g = 0; g < rule.groups.length; g++) {
        var f = foundTerms(c, RF_TERMS[rule.groups[g]]);
        if (f.length === 0) { matched = false; break; }
        evidence = evidence.concat(f);
      }
    } else if (rule.kind === "any") {
      var fa = foundTerms(c, RF_TERMS[rule.groups[0]]);
      matched = fa.length > 0;
      evidence = fa;
    } else if (rule.kind === "severity") {
      var sevOk = (typeof severityValue === "number" && severityValue >= 8) || severityInCorpus(c);
      var fc = foundTerms(c, RF_TERMS[rule.groups[0]]);
      matched = sevOk && fc.length > 0;
      evidence = fc;
    }
    var entry = { id: rule.id, en: rule.en, hi: rule.hi, matched: matched, evidence: evidence };
    all.push(entry);
    if (matched) hits.push(entry);
  }
  return { hits: hits, all: all };
}

function extractDose(text) {
  var m = String(text || "").match(/(\d+(?:\.\d+)?)\s*(mg|ml|mcg|gm|g|units?|iu)\b/i);
  if (m) return m[1] + " " + m[2].toLowerCase();
  var n = String(text || "").match(/\d+(?:\.\d+)?/);
  return n ? n[0] : null;
}

function hasNumber(text) {
  return /\d/.test(String(text || ""));
}

function mkToken() {
  var chars = "ABCDEFGHJKMNPQRSTVWXYZ23456789";
  var s = "";
  for (var i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return "MKD-" + s;
}

function initialState() {
  return {
    phase: "welcome",
    lang: "rom",
    scriptId: "redflag",
    cursor: "narrative",
    complaintId: null,
    answers: {},
    log: [],
    redFlag: null,
    pendingDose: null,
    returnTo: null,
    token: mkToken(),
    startedAt: null,
    confirmedAt: null
  };
}

function turnOptions(turn, state) {
  if (!turn.options) return [];
  return turn.options(state ? state.complaintId : null) || [];
}

function promptFor(turn, state) {
  var lang = state.lang;
  var ask = turn.ask || {};
  if (turn.id === "cc") {
    ask = state.answers.narrative && detectComplaint(state.answers.narrative.utterance || state.answers.narrative.en) ? turn.askConfirm : turn.askOpen;
  }
  var primary, secondary;
  if (lang === "hi") { primary = ask.hi || ask.en; secondary = ask.en; }
  else if (lang === "rom") { primary = ask.rom || ask.en; secondary = ask.hi || ask.en; }
  else { primary = ask.en; secondary = ask.hi || ask.en; }
  return { primary: primary, secondary: secondary };
}

function textSlot(text, state) {
  return { state: "captured", v: text, en: text, hi: null, utterance: text, source: "voice", ts: Date.now() };
}

function chipSlot(turn, o, state, extra) {
  var s = { state: "captured", v: o.v, en: o.en, hi: o.hi, utterance: null, source: "touch", ts: Date.now() };
  if (o.review) { s.state = "needs_review"; }
  if (extra) for (var k in extra) s[k] = extra[k];
  return s;
}

function multiSlot(turn, opts, selV, detailText, state) {
  var en = [], hi = [];
  var v = [];
  var noneOnly = selV.length === 1 && isExclusiveSel(opts, selV[0]);
  for (var i = 0; i < selV.length; i++) {
    var o = findOpt(opts, selV[i]);
    if (o) { en.push(o.en); hi.push(o.hi); v.push(o.v); }
  }
  var s = { state: "captured", v: v, en: en.join("; "), hi: hi.join("; "), utterance: null, source: "touch", ts: Date.now() };
  if (detailText && detailText.trim()) {
    s.detail = detailText.trim();
    s.en = s.en + " — " + s.detail;
  }
  return s;
}

function findOpt(opts, v) {
  for (var i = 0; i < opts.length; i++) if (opts[i].v === v) return opts[i];
  return null;
}

function isExclusiveSel(opts, v) {
  var o = findOpt(opts, v);
  return !!(o && o.exclusive);
}

function notAnsweredSlot() {
  return { state: "not_answered", v: null, en: "Will tell the doctor", hi: "डॉक्टर से बताएँगे", utterance: null, source: "touch", ts: Date.now() };
}

function logEntry(who, turnId, text, variant) {
  return { who: who, turnId: turnId, text: text, variant: variant || null };
}

function buildCorpus(answers) {
  var parts = [];
  var n = answers.narrative;
  if (n) parts.push(n.utterance || n.en || "");
  for (var k in answers) {
    if (k === "narrative") continue;
    var s = answers[k];
    if (!s) continue;
    if (s.en) parts.push(s.en);
    if (s.hi) parts.push(s.hi);
    if (s.utterance) parts.push(s.utterance);
    if (s.detail) parts.push(s.detail);
  }
  return parts.join(" \u2022 ").toLowerCase();
}

function computeRedFlag(answers) {
  var sev = answers["socrates.severity"];
  var sevVal = sev && typeof sev.v === "number" ? sev.v : null;
  return runSafetyCheck(buildCorpus(answers), sevVal);
}

function advance(state, turnList) {
  var list = turnList || turnListFor(state.complaintId);
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === state.cursor) { idx = i; break; }
  var nextIdx = idx + 1;
  if (state.returnTo && state.returnTo === "readback") {
    return Object.assign({}, state, { phase: "readback", returnTo: null, pendingDose: null });
  }
  if (nextIdx >= list.length) {
    return Object.assign({}, state, { phase: "readback", pendingDose: null });
  }
  var next = Object.assign({}, state, { cursor: list[nextIdx].id, pendingDose: null });
  if (next.cursor === "safety" && !next.redFlag) {
    next.redFlag = computeRedFlag(next.answers);
    var hitIds = next.redFlag.hits.map(function (h) { return h.id; }).join(", ");
    next.log = next.log.concat([
      logEntry("sys", "safety", next.redFlag.hits.length > 0
        ? "SAFETY CHECK: " + hitIds + " matched — urgent flag raised (deterministic rules)"
        : "SAFETY CHECK: 4 rules checked — none matched", next.redFlag.hits.length > 0 ? "sysRed" : "sysOk")
    ]);
  }
  return next;
}

function answerTurn(state, turnId, slot, opts) {
  opts = opts || {};
  var turn = TURNS[turnId];
  var answers = Object.assign({}, state.answers);
  answers[turnId] = slot;
  var list = turnListFor(answers.cc ? (answers.cc.v && answers.cc.v.id) || state.complaintId : state.complaintId);
  if (turnId === "cc" && slot.v && slot.v.id) {
    state = Object.assign({}, state, { complaintId: slot.v.id });
  }
  var entry = { who: "patient", turnId: turnId, text: slot.en || "" };
  var log = state.log.concat(opts.noLog ? [] : [entry]);
  var next = Object.assign({}, state, { answers: answers, log: log });
  if (turnId === "meds" && slot.state === "captured" && slot.source === "voice" && hasNumber(slot.en)) {
    next.pendingDose = extractDose(slot.en);
    return next;
  }
  if (turnId === "meds" && slot.state === "captured" && slot.source === "voice" && !hasNumber(slot.en)) {
    next.log = next.log.concat([logEntry("sys", "meds", "Note: no dose number detected — name recorded as spoken; staff can confirm at check-in.")]);
  }
  return advance(next, list);
}

function reducer(state, action) {
  switch (action.type) {
    case "START":
      return {
        phase: "interview",
        lang: action.lang,
        scriptId: action.scriptId,
        cursor: "narrative",
        complaintId: null,
        answers: {},
        log: [],
        redFlag: null,
        pendingDose: null,
        returnTo: null,
        token: state.token || mkToken(),
        startedAt: Date.now(),
        confirmedAt: null
      };
    case "ANSWER":
      return answerTurn(state, action.turnId, action.slot, action.opts);
    case "DOSE_CONFIRM":
      if (action.ok) {
        var meds = Object.assign({}, state.answers.meds, { doseConfirmed: true, dose: state.pendingDose });
        var st = Object.assign({}, state, {
          answers: Object.assign({}, state.answers, { meds: meds }),
          pendingDose: null,
          log: state.log.concat([logEntry("sys", "meds", "Dose confirmed by patient: " + state.pendingDose, "sysOk")])
        });
        return advance(st);
      }
      var answers2 = Object.assign({}, state.answers);
      delete answers2.meds;
      return Object.assign({}, state, {
        pendingDose: null,
        answers: answers2,
        cursor: "meds",
        log: state.log.concat([logEntry("sys", "meds", "Dose re-entry requested")])
      });
    case "SAFETY_ACK":
      var rf = Object.assign({}, state.redFlag, { ack: true, ackAt: Date.now() });
      return Object.assign({}, state, { redFlag: rf, log: state.log.concat([logEntry("sys", "safety", "Staff acknowledged the urgent flag — continuing history in priority mode", "sysRed")]) });
    case "SAFETY_CONTINUE":
      return advance(Object.assign({}, state, {}));
    case "CHANGE_FIELD":
      return Object.assign({}, state, { phase: "interview", cursor: action.turnId, returnTo: "readback" });
    case "CONFIRM_SUMMARY":
      return Object.assign({}, state, { phase: "handoff", confirmedAt: Date.now() });
    case "TO_READBACK":
      return Object.assign({}, state, { phase: "readback" });
    case "RESTART":
      return Object.assign(initialState(), { lang: state.lang, scriptId: state.scriptId });
    case "JUMP":
      return action.state;
    default:
      return state;
  }
}

function scriptSlotFor(turn, script, lang, ts) {
  var a = script.answers[turn.id];
  if (!a) return null;
  var opts = turnOptions(turn, { complaintId: script.complaint });
  if (a.chip) {
    var o = findOpt(opts, a.chip);
    if (!o) return null;
    var s = chipSlot(turn, o, null);
    s.ts = ts;
    if (o.review) s.state = "needs_review";
    return s;
  }
  if (a.chips) {
    var m = multiSlot(turn, opts, a.chips, a.detail ? pickLangText(a.detail, lang) : null, null);
    m.ts = ts;
    return m;
  }
  if (a.text) {
    var t = pickLangText(a.text, lang);
    var st = textSlot(t, null);
    st.ts = ts;
    return st;
  }
  if (typeof a.n === "number") {
    return { state: "captured", v: a.n, en: a.n + " / 10", hi: a.n + " / 10", utterance: null, source: "touch", ts: ts };
  }
  if (a.yn) {
    var yo = findOpt(YN_OPTS, a.yn);
    return { state: a.yn === "not_sure" ? "needs_review" : "captured", v: a.yn, en: yo.en, hi: yo.hi, utterance: null, source: "touch", ts: ts };
  }
  if (a.confirm) {
    var comp = complaintById(script.complaint);
    return { state: "captured", v: comp, en: comp.en, hi: comp.hi, utterance: null, source: "touch", ts: ts };
  }
  return null;
}

function cannedState(scriptId, phase, stopAtTurn, lang, keepToken) {
  var script = DEMO_SCRIPTS[scriptId];
  var state = Object.assign(initialState(), {
    phase: "interview",
    lang: lang || "rom",
    scriptId: scriptId,
    cursor: "narrative",
    startedAt: Date.now() - 210000
  });
  if (!script) {
    return Object.assign(state, { phase: phase || "readback" });
  }
  var list = turnListFor(script.complaint);
  var isSafetyShot = phase === "safety";
  var answers = {};
  var log = [];
  var redFlag = null;
  var pendingDose = null;
  var ts = state.startedAt + 4000;
  for (var i = 0; i < list.length; i++) {
    var turn = list[i];
    if (turn.id === "safety") {
      redFlag = computeRedFlag(answers);
      redFlag.ack = !isSafetyShot;
      log.push(logEntry("sys", "safety", redFlag.hits.length > 0
        ? "SAFETY CHECK: " + redFlag.hits.map(function (h) { return h.id; }).join(", ") + " matched — urgent flag raised (deterministic rules)"
        : "SAFETY CHECK: 4 rules checked — none matched", redFlag.hits.length > 0 ? "sysRed" : "sysOk"));
      ts += 8000;
      continue;
    }
    if (stopAtTurn && turn.id === stopAtTurn) break;
    var slot = scriptSlotFor(turn, script, state.lang, ts);
    if (slot) {
      answers[turn.id] = slot;
      log.push(logEntry("patient", turn.id, slot.en || ""));
      ts += 5000;
      if (turn.id === "meds" && slot.source === "voice" && hasNumber(slot.en)) {
        slot.dose = extractDose(slot.en);
        if (script.doseConfirmed) {
          slot.doseConfirmed = true;
          log.push(logEntry("sys", "meds", "Dose confirmed by patient: " + slot.dose, "sysOk"));
        } else {
          pendingDose = slot.dose;
        }
      }
    }
  }
  var st = Object.assign({}, state, {
    answers: answers,
    log: log,
    redFlag: redFlag,
    pendingDose: pendingDose,
    cursor: isSafetyShot ? "safety" : (stopAtTurn || "ice.expect"),
    complaintId: script.complaint,
    phase: isSafetyShot ? "interview" : (phase || "readback")
  });
  return st;
}

function expectedTurnIds(complaintId) {
  return turnListFor(complaintId).map(function (t) { return t.id; });
}

function dataQuality(answers, complaintId) {
  var ids = expectedTurnIds(complaintId).filter(function (id) { return id !== "safety"; });
  var counts = { captured: 0, needs_review: 0, not_answered: 0, not_elicited: 0 };
  for (var i = 0; i < ids.length; i++) {
    var s = answers[ids[i]];
    var st = s ? s.state : "not_elicited";
    counts[st] = (counts[st] || 0) + 1;
  }
  counts.total = ids.length;
  return counts;
}

function summarySections(state) {
  var A = state.answers;
  var out = [];
  function row(turnId, labelEn, labelHi) {
    var s = A[turnId] || { state: "not_elicited", v: null, en: null, hi: null, utterance: null, source: null };
    return { turnId: turnId, label: { en: labelEn, hi: labelHi }, slot: s };

  out.push({
    id: "cc", title: { en: "Main problem", hi: "मुख्य समस्या" },
    rows: [row("cc", "Chief complaint (in your words)", "मुख्य शिकायत (आपके शब्दों में)")]
  });
  var socratesRows = SOCRATES_IDS.map(function (id) {

  out.push({

  return out;
}

    <span className="dbNote">microphone input - clinical excerpts · deterministic safety rules (demo list) · never diagnoses<//>
    ${elapsed ? html`<span className="dbTimer">${elapsed}<//>` : null}
  <//>`;
};

function initialShotState() {

  var lang = params.lang || "rom";

  return MK.cannedState(script, shot, turn, lang);
}
