<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="MediKiosk — patient self check-in for OPD: voice and touch history, paper digitisation, and a physician-ready summary." />
<title>MediKiosk — OPD self check-in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E6E66'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>

:root{
  --bg:#F4F1EA;
  --surface:#FFFFFF;
  --surface2:#FBFAF6;
  --ink:#1D2B32;
  --muted:#5D6E74;
  --line:#E3DDCE;
  --line2:#D2CBB8;
  --teal:#0E6E66;
  --teal-d:#0A544E;
  --teal-dd:#083F3B;
  --teal-bg:#E4F1EF;
  --teal-line:#AFD9D3;
  --red:#B42318;
  --red-d:#8E1B12;
  --red-bg:#FDECE7;
  --red-line:#EFB4A6;
  --amber:#96620F;
  --amber-bg:#FBF1DC;
  --amber-line:#E8D3A6;
  --ok:#1B7A43;
  --ok-bg:#E5F4EA;
  --radius:18px;
  --shadow:0 2px 10px rgba(29,43,50,.07), 0 14px 36px rgba(29,43,50,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI","Nirmala UI","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
h1,h2,h3,h4,p{margin:0}
#root{min-height:100vh;display:flex;flex-direction:column}


.controlbar{
  background:#232B2F;color:#C9D2D6;
  border-bottom:3px dashed #4A585F;
  font-size:12.5px;
  padding:7px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:0;z-index:60;
}
.controlbar .cbTitle{font-weight:700;letter-spacing:.06em;color:#EDD9A3;white-space:nowrap}
.controlbar .cbBtn{
  background:transparent;color:#DCE4E8;
  border:1.5px solid #4A585F;border-radius:8px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;
}
.controlbar .cbBtn:hover{background:#34404A}
.controlbar .cbSpacer{flex:1}
.controlbar .cbNote{color:#93A3AB}
.controlbar .cbTimer{font-variant-numeric:tabular-nums;color:#EDD9A3;font-weight:600}


.hdr{
  background:linear-gradient(100deg,var(--teal-dd),var(--teal-d) 55%,var(--teal));
  color:#fff;
  padding:14px 22px;
}
.hdrInner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandMark{
  width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:300;color:#fff;flex:none;
}
.brandTxt h1{font-size:1.35rem;font-weight:700;letter-spacing:.01em}
.brandTxt .sub{font-size:.8rem;opacity:.85;margin-top:1px}
.hdrChips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hdrChip{
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  color:#fff;border-radius:999px;padding:5px 13px;font-size:.78rem;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.hdrChip .dot{width:8px;height:8px;border-radius:50%;background:#7BE3B0;display:inline-block}
.hdrChip.noteChip{background:rgba(255,255,255,.9);color:var(--teal-dd);border-color:#fff}
button.hdrChip{cursor:pointer;font-family:inherit}
button.hdrChip:hover{background:rgba(255,255,255,.28)}
button.hdrChip.soundChip{background:rgba(255,255,255,.9);color:var(--teal-dd);border-color:#fff}
button.hdrChip.soundChip.on{background:#FFF3D6;border-color:#E8D3A6;color:var(--amber)}


.urgentStrip{
  background:var(--red);color:#fff;
  padding:9px 22px;font-weight:600;font-size:.92rem;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.urgentStrip .usBadge{background:#fff;color:var(--red);border-radius:8px;padding:2px 10px;font-weight:800;font-size:.8rem;letter-spacing:.04em}
.urgentStrip .usRight{margin-left:auto;font-weight:500;opacity:.95;font-size:.82rem}


.stage{
  max-width:1240px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;
  padding:22px 22px 70px;align-items:start;flex:1;
}


.rail{position:sticky;top:96px;display:flex;flex-direction:column;gap:8px}
.railTitle{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:2px 4px 4px}
.railItem{
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:2px solid var(--line);
  border-radius:14px;padding:10px 13px;
  font-size:.9rem;color:var(--muted);
}
.railItem .rDot{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--bg);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;color:var(--muted);
}
.railItem.done{color:var(--teal-d);border-color:var(--teal-line);background:var(--teal-bg)}
.railItem.done .rDot{background:var(--teal);border-color:var(--teal);color:#fff}
.railItem.current{color:var(--ink);border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,110,102,.12);font-weight:600}
.railItem.current .rDot{border-color:var(--teal);color:var(--teal)}
.railItem.flagged{border-color:var(--red-line);background:var(--red-bg);color:var(--red-d)}
.railItem.flagged .rDot{background:var(--red);border-color:var(--red);color:#fff}
.railItem .rLab{line-height:1.25}
.railItem .rLab .rLabHi{display:block;font-size:.76rem;color:inherit;opacity:.75}
.railSub{font-size:.74rem;color:var(--muted);margin:-3px 4px 4px;padding-left:2px}


.logCol{display:flex;flex-direction:column;gap:16px;min-width:0}
.log{
  background:var(--surface2);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;max-height:32vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.logEmpty{color:var(--muted);font-size:.9rem;text-align:center;padding:8px 0}
.msg{max-width:88%;font-size:.92rem}
.msg .mWho{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px;opacity:.7}
.msg.kiosk{align-self:flex-start}
.msg.kiosk .mBody{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--teal);border-radius:4px 14px 14px 14px;padding:9px 13px}
.msg.patient{align-self:flex-end;text-align:right}
.msg.patient .mBody{background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:14px 4px 14px 14px;padding:9px 13px;display:inline-block;text-align:left}
.msg.patient .mMeta{font-size:.72rem;color:var(--muted);margin-top:3px}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .mBody{
  background:var(--amber-bg);border:1.5px solid var(--amber-line);border-radius:999px;
  padding:6px 15px;font-size:.82rem;color:var(--amber);font-weight:600;text-align:center;
}
.msg.sys.sysRed .mBody{background:var(--red-bg);border-color:var(--red-line);color:var(--red-d)}
.msg.sys.sysOk .mBody{background:var(--ok-bg);border-color:#BCE3C9;color:var(--ok)}


.card{
  background:var(--surface);border:2px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);
  padding:26px 28px 24px;
}
.stepTag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--teal);background:var(--teal-bg);
  border:1.5px solid var(--teal-line);border-radius:999px;
  padding:4px 13px;margin-bottom:14px;
}
.prompt{font-size:1.5rem;font-weight:600;line-height:1.32}
.promptSub{font-size:1.04rem;color:var(--muted);margin-top:6px;line-height:1.4}
.speakBtn{
  margin-left:10px;background:transparent;border:1.5px solid var(--teal-line);
  color:var(--teal);border-radius:999px;font-size:.72rem;font-weight:700;
  padding:4px 12px;cursor:pointer;vertical-align:middle;
}
.speakBtn:hover{background:var(--teal-bg)}
.speakWrap{display:inline-block;vertical-align:middle;margin-left:10px}
.speakNote{display:block;font-size:.7rem;color:var(--muted);margin-top:4px;max-width:360px;line-height:1.35}
.voiceTag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;color:var(--teal-d);background:var(--teal-bg);
  border:1.5px dashed var(--teal-line);border-radius:8px;padding:3px 10px;margin-top:12px;
}
.voiceTag b{font-weight:700}

.chipGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:20px}
.chip{
  background:#fff;border:2px solid var(--line2);
  border-radius:15px;padding:13px 15px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:3px;position:relative;min-height:64px;justify-content:center;
  transition:border-color .12s, background .12s, transform .05s;
}
.chip:hover{border-color:var(--teal);background:var(--surface2)}
.chip:active{transform:scale(.985)}
.chip .cEn{font-size:1rem;font-weight:600;line-height:1.25}
.chip .cHi{font-size:.85rem;color:var(--muted);line-height:1.3}
.chip.suggested::after{
  content:"Suggested answer";
  position:absolute;top:-10px;right:10px;
  background:var(--teal);color:#fff;font-size:.64rem;font-weight:800;letter-spacing:.06em;
  border-radius:999px;padding:2px 9px;text-transform:uppercase;
}
.chip.selected{background:var(--teal-bg);border-color:var(--teal)}
.chip.selExcl{opacity:.55}
.yesNoRow{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.yesNoRow .chip{min-width:150px;flex:1;text-align:center;align-items:center}

.scaleGrid{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;margin-top:20px}
.scaleBtn{
  border:2px solid var(--line2);background:#fff;border-radius:12px;
  font-size:1.15rem;font-weight:700;padding:14px 0;cursor:pointer;color:var(--ink);
}
.scaleBtn:hover{border-color:var(--teal)}
.scaleBtn.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.scaleHint{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:8px}
.scaleGo{margin-top:16px}

.orDiv{display:flex;align-items:center;gap:12px;margin:18px 0 10px;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.05em}
.orDiv::before,.orDiv::after{content:"";flex:1;border-top:2px dashed var(--line2)}

.inputRow{display:flex;gap:10px;align-items:stretch}
.inputRow textarea{
  flex:1;font-family:inherit;font-size:1.02rem;color:var(--ink);
  border:2px solid var(--line2);border-radius:14px;padding:12px 14px;resize:vertical;min-height:58px;
  background:var(--surface2);
}
.inputRow textarea:focus{outline:3px solid rgba(14,110,102,.25);border-color:var(--teal)}
.voiceStatus{margin-top:7px;color:var(--muted);font-size:.82rem;line-height:1.35}
.voiceBtn{background:var(--teal-d)}
.btn{
  background:var(--teal);color:#fff;border:none;border-radius:14px;
  font-size:1rem;font-weight:700;padding:12px 24px;cursor:pointer;min-height:54px;
}
.btn:hover{background:var(--teal-d)}
.btn:disabled{background:var(--line2);cursor:not-allowed}
.btn.ghost{
  background:transparent;color:var(--teal-d);border:2px solid var(--teal-line);
}
.btn.ghost:hover{background:var(--teal-bg)}
.btn.big{font-size:1.12rem;padding:16px 30px;min-height:64px}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:var(--red-d)}
.btnRow{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.skipLink{
  background:none;border:none;color:var(--muted);font-size:.85rem;text-decoration:underline;
  cursor:pointer;margin-top:16px;padding:4px 2px;
}
.skipLink:hover{color:var(--ink)}
.exampleBtn{
  background:var(--surface2);border:1.5px dashed var(--teal-line);color:var(--teal-d);
  border-radius:12px;padding:10px 14px;font-size:.9rem;cursor:pointer;text-align:left;
}
.exampleBtn:hover{background:var(--teal-bg)}
.exampleBtn .xTag{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:3px}

.detailRow{margin-top:14px}
.detailRow label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:6px}
.detailRow textarea{width:100%;font-family:inherit;font-size:.95rem;border:2px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:46px;background:var(--surface2)}


.ccBox{
  background:var(--teal-bg);border:2px solid var(--teal-line);border-radius:16px;
  padding:16px 18px;margin-top:18px;
}
.ccBox .ccLbl{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.ccBox .ccVal{font-size:1.4rem;font-weight:700;margin-top:4px}
.ccBox .ccHi{color:var(--teal-d);opacity:.85}


.safetyNote{
  margin-top:14px;font-size:.8rem;color:var(--muted);
  background:var(--surface2);border:1.5px dashed var(--line2);border-radius:10px;padding:9px 12px;
}
.overlay{
  position:fixed;inset:0;z-index:90;overflow:auto;
  background:rgba(96,16,9,.45);
  padding:4vh 16px 8vh;
  display:flex;justify-content:center;align-items:flex-start;
}
.alertCard{
  width:100%;max-width:900px;background:#fff;border-radius:24px;overflow:hidden;
  border:3px solid var(--red);box-shadow:0 30px 80px rgba(90,10,5,.4);
}
.alertHead{background:var(--red);color:#fff;padding:26px 30px}
.alertHead .ahTag{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.alertHead h2{font-size:1.7rem;font-weight:800;margin-top:4px;line-height:1.25}
.alertHead .ahHi{font-size:1.12rem;margin-top:4px;opacity:.95}
.alertHead .ahWhy{
  margin-top:14px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);
  border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.4;
}
.alertBody{padding:24px 30px 28px}
.ruleList{display:flex;flex-direction:column;gap:10px}
.rule{
  border:2px solid var(--line);border-radius:14px;padding:12px 16px;
  display:flex;gap:12px;align-items:flex-start;background:var(--surface2);
}
.rule .rId{
  font-size:.7rem;font-weight:800;letter-spacing:.06em;border-radius:7px;
  padding:3px 8px;flex:none;margin-top:2px;background:var(--line);color:var(--muted);
}
.rule .rTxt{font-size:.95rem;line-height:1.35}
.rule .rStatus{font-size:.78rem;font-weight:700;margin-top:3px;color:var(--muted)}
.rule.matched{border-color:var(--red);background:var(--red-bg)}
.rule.matched .rId{background:var(--red);color:#fff}
.rule.matched .rTxt{font-weight:700;color:var(--red-d)}
.rule.matched .rStatus{color:var(--red);font-weight:800}
.evidence{
  background:#fff;border:1.5px dashed var(--red-line);border-radius:10px;
  padding:8px 12px;margin-top:8px;font-size:.86rem;
}
.evidence b{font-weight:700}
.alertInstruction{
  margin-top:20px;background:var(--red-bg);border:2px solid var(--red-line);
  border-radius:16px;padding:18px 20px;
}
.alertInstruction .aiBig{font-size:1.25rem;font-weight:700;line-height:1.35}
.alertInstruction .aiHi{font-size:1.05rem;color:var(--red-d);margin-top:4px}
.alertInstruction .aiMeta{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.aiPill{
  background:#fff;border:1.5px solid var(--red-line);color:var(--red-d);
  font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 13px;
}
.alertActions{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.alertActions .aaNote{font-size:.8rem;color:var(--muted)}

.safetyOk{
  border:2px solid var(--teal-line);background:var(--teal-bg);border-radius:20px;padding:24px 26px;
}
.safetyOk h3{font-size:1.3rem;color:var(--teal-dd)}
.safetyOk .soHi{color:var(--teal-d);font-size:1.02rem;margin-top:2px}


.welcome{max-width:980px;margin:0 auto;padding:34px 22px 70px;width:100%}
.wHero{text-align:center;margin-bottom:26px}
.wHero .wKicker{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.wHero h2{font-size:2rem;font-weight:800;margin-top:8px;line-height:1.25}
.wHero .wSub{font-size:1.05rem;color:var(--muted);margin-top:10px;max-width:640px;margin-left:auto;margin-right:auto}
.wCard{
  background:var(--surface);border:2px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);padding:28px 30px;
}
.wLabel{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.wLabel:first-child{margin-top:0}
.langRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.langTile{
  border:2px solid var(--line2);border-radius:16px;background:#fff;padding:16px;
  cursor:pointer;text-align:center;
}
.langTile .lMain{font-size:1.15rem;font-weight:700}
.langTile .lSub{font-size:.82rem;color:var(--muted);margin-top:3px}
.langTile.sel{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 4px rgba(14,110,102,.12)}
.scriptRow{display:flex;flex-direction:column;gap:12px}
.scriptCard{
  border:2px solid var(--line2);border-radius:16px;background:#fff;padding:15px 18px;
  cursor:pointer;display:flex;gap:14px;align-items:flex-start;text-align:left;
}
.scriptCard.sel{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 4px rgba(14,110,102,.12)}
.scriptCard .scDot{
  width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line2);flex:none;margin-top:3px;
  background:#fff;
}
.scriptCard.sel .scDot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3.5px #fff}
.scriptCard .scT{font-size:1.02rem;font-weight:700}
.scriptCard .scD{font-size:.88rem;color:var(--muted);margin-top:3px;line-height:1.4}
.scriptCard .scFlag{
  display:inline-block;background:var(--red-bg);border:1.5px solid var(--red-line);color:var(--red-d);
  font-size:.68rem;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:8px;
  letter-spacing:.05em;vertical-align:2px;
}
.wStart{display:flex;justify-content:center;margin-top:26px}
.wToken{
  margin-top:20px;font-size:.82rem;color:var(--muted);text-align:center;
}
.wToken code{background:var(--surface2);border:1.5px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.82rem}
.honestyBox{
  margin-top:22px;background:var(--amber-bg);border:2px solid var(--amber-line);
  border-radius:16px;padding:15px 19px;font-size:.88rem;color:#6B4A10;line-height:1.5;
}
.honestyBox b{font-weight:800}
.honestyBox .hbT{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;margin-bottom:5px;color:var(--amber)}
.ayushNote{
  margin-top:14px;font-size:.82rem;color:var(--muted);background:var(--surface2);
  border:1.5px dashed var(--line2);border-radius:12px;padding:10px 14px;line-height:1.45;
}


.sumWrap{max-width:1020px;margin:0 auto;padding:26px 22px 80px;width:100%}
.sumHead{text-align:center;margin-bottom:22px}
.sumHead h2{font-size:1.75rem;font-weight:800}
.sumHead .shHi{font-size:1.15rem;color:var(--teal-d);margin-top:2px}
.sumHead .shSub{color:var(--muted);margin-top:8px;font-size:.98rem;max-width:620px;margin-left:auto;margin-right:auto}
.sumFlagBanner{
  margin:0 0 18px;background:var(--red);color:#fff;border-radius:16px;padding:14px 20px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700;
}
.sumFlagBanner .fbTag{background:#fff;color:var(--red);border-radius:8px;padding:3px 11px;font-weight:800;font-size:.78rem;letter-spacing:.05em}
.sumSection{
  background:var(--surface);border:2px solid var(--line);border-radius:20px;
  padding:18px 22px;margin-bottom:16px;
}
.sumSection h3{font-size:1.06rem;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* ===== medikiosk additions (same tokens) ===== */
/* MediKiosk additions on top of the archived Sep-11 Module A stylesheet.
   Same tokens, same components; only what the four-module flow needs beyond
   the Module A screens: speaker picker, paper hand-over, extraction tables,
   physician view, consent agreement, hotspot selection, toasts, RTL. */

.hidden{display:none !important}

/* header speaker picker, rendered as a header chip */
select.hdrChip{
  appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.3);
  color:#fff;border-radius:999px;padding:5px 13px;font-size:.78rem;font-weight:600;
  font-family:inherit;max-width:280px;cursor:pointer;
}
select.hdrChip option{color:#1D2B32;background:#fff}
.hdrChip.modOn{background:rgba(255,255,255,.9);color:var(--teal-dd);border-color:#fff}

/* sound hint + toast */
.soundHint{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:95;
  background:#1D2B32;color:#fff;padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:.82rem;box-shadow:var(--shadow);text-align:center;max-width:92vw;
}
.toast{
  position:fixed;right:22px;bottom:22px;z-index:95;max-width:420px;
  background:#1D2B32;color:#fff;padding:13px 18px;border-radius:12px;
  box-shadow:var(--shadow);font-weight:600;font-size:.82rem;
}
.toast.err{background:var(--red)}

/* body-map hotspot selection + labels over the realistic figure */
.anatomyWrap{position:relative;width:min(280px,72vw);background:var(--surface2);border:2px solid var(--line);border-radius:var(--radius);padding:10px}
.anatomyImg{display:block;width:100%;height:auto;border-radius:10px}
.anatomyHot{position:absolute;background:transparent;border:2px solid transparent;border-radius:12px;cursor:pointer;padding:0}
.anatomyHot:hover,.anatomyHot:focus-visible{background:rgba(14,110,102,.18);border-color:var(--teal);outline:none}
.anatomyHot.sel{background:rgba(14,110,102,.30);border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,110,102,.25)}
.anatomyLbl{position:absolute;left:50%;top:2px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--teal-dd);background:#fff;border:1.5px solid var(--teal-line);border-radius:999px;padding:1px 9px;opacity:0;pointer-events:none}
.anatomyHot:hover .anatomyLbl,.anatomyHot:focus-visible .anatomyLbl,.anatomyHot.sel .anatomyLbl{opacity:1}

/* paper hand-over */
.fileInput{
  width:100%;font-family:inherit;font-size:1rem;color:var(--ink);
  border:2px solid var(--line2);border-radius:14px;padding:14px;background:var(--surface2);

}

.paperHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface2);border-bottom:2px solid var(--line);font-size:.85rem;font-weight:700}

.scanline{position:relative}
.scanline .sweep{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--teal),transparent);box-shadow:0 0 18px 4px rgba(14,110,102,.5);animation:sweep 2.1s linear infinite}
@keyframes sweep{0%{top:0}100%{top:100%}}

/* extraction tables */

.kv dd{margin:0;font-weight:600}

/* physician view */
.physShell{display:grid;grid-template-columns:320px 1fr;gap:18px;max-width:1240px;margin:0 auto;padding:22px 22px 70px;align-items:start}

.workItem + .workItem{margin-top:10px}
.workItem[aria-current="true"]{border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,110,102,.12)}
.soapAp{border:2px dashed var(--line2);border-radius:14px;padding:14px 18px;background:var(--surface2);color:var(--muted)}
.fhirBlock{font-family:ui-monospace,monospace;font-size:.72rem;background:#1D2B32;color:#D7E6EF;padding:16px;border-radius:12px;overflow-x:auto;white-space:pre-wrap}
table.data{width:100%;border-collapse:collapse;font-size:.86rem}
table.data th,table.data td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);vertical-align:top}
table.data th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.alertBox{border-left:6px solid var(--line2);padding:10px 14px;border-radius:10px;margin-bottom:10px;background:var(--surface2);font-size:.88rem}
.alertBox.red{border-color:var(--red);background:var(--red-bg);color:var(--red-d)}
.alertBox.amber{border-color:var(--amber-line);background:var(--amber-bg);color:#6B4A10}

/* RTL languages */
[dir="rtl"] .msg.patient{text-align:left}
[dir="rtl"] .msg.patient .mBody{text-align:right}

/* ===== app.js ===== */
/* Medikiosk prototype controller.
   Drives the four modules as one guided visit:
     D  consent + ABHA reference
     A  voice + touch history capture with red-flag screening
     B  paper digitisation of an Indian patient's reports
     C  merged summary, patient read-back and physician hand-off
   Voice output uses the browser speech engine and starts on its own. Voice
   input opens automatically after each question but the visit never moves on
   without the patient: it waits for a spoken answer, a tap, or an explicit
   Continue. Module B waits for the papers to be handed over before it reads
   anything. Nothing runs ahead of the person at the kiosk. */

(function () {
  "use strict";

  const S = {
    lang: "en",
    phase: "welcome",
    stepIdx: 0,
    answers: {},
    voiceOn: true,
    agree: false,
    spoken: false,
    unlocking: false,
    listening: false,
    safetyAck: false,
    safetySeen: false,
    safetyStage: null,      // checking -> overlay -> panel
    redFired: false,
    redHits: [],
    docsStage: "upload",   // upload -> scan -> review
    extracted: 0,
    uploads: [],
    heard: "",
    voiceNote: "",
    log: [],
    startedAt: null,
    toastMsg: null,
    bodyView: "front",
    bodyRegion: null,
    tapped: false,
    rb: {},
    voiceName: (function () { try { return localStorage.getItem("mk.voice") || ""; } catch (e) { return ""; } })(),
    busy: false,
  };

  const REGION_COMPLAINT = {
    head: "headache", chest: "chest pain", abdomen: "stomach pain", back: "back pain",
    armL: "arm pain", armR: "arm pain", legL: "knee / joint pain", legR: "knee / joint pain",
    general: "your main problem",
  };

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function el(tag, props, children) {
    const n = document.createElement(tag);
    props = props || {};
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style") n.style.cssText = v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) n.setAttribute(k, "");
      else n.setAttribute(k, v);
    }
    [].concat(children || []).forEach((c) => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return n;
  }
  const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };
  function line(text, value, sub, right) {
    return el("div", { class: "line" }, [
      el("div", {}, [
        el("div", { class: "v", text: value }),
        sub ? el("div", { class: "sub", text: sub }) : null,
      ]),
      right || null,
    ]);
  }
  const pct = (n) => Math.round(n * 100) + "%";

  function moduleForPhase() {
    if (S.phase === "welcome") return "D";
    if (S.phase === "documents") return "B";
    if (S.phase === "merge" || S.phase === "readback" || S.phase === "handoff" || S.phase === "physician") return "C";
    return "A";
  }

  /* ------------------------------------------------------------------ voice */

  const Voice = (function () {
    const supported = typeof window !== "undefined" && "speechSynthesis" in window;
    let voices = [];
    let onReady = null;

    /* Pull the installed voices into the cache. This must never notify: it is
       called from inside the notify path, and notifying again re-enters the
       caller (an infinite recursion that a real browser hits because voices
       start empty and arrive asynchronously). */
    function snapshot() {
      if (!supported) return;
      try {
        const v = window.speechSynthesis.getVoices() || [];
        if (v.length) voices = v;
      } catch (e) { /* keep whatever we have */ }
    }

    let notifying = false;
    function refresh() {
      snapshot();
      if (onReady && !notifying) {
        notifying = true;
        try { onReady(voices); } finally { notifying = false; }
      }
    }

    function load(cb) {
      if (!supported) return;
      if (cb) onReady = cb;
      refresh();
      try { window.speechSynthesis.onvoiceschanged = () => refresh(); } catch (e) {}
      setTimeout(refresh, 300);
      setTimeout(refresh, 1500);
    }

    const baseOf = (tag) => String(tag || "").toLowerCase().replace(/_/g, "-").split("-")[0];

    /* Rank the installed voices so the default is the best-sounding one rather
       than whichever happens to come first. Natural/Neural and Google voices
       sound far better in a recording than the legacy offline ones. */
    function rank(v, tag) {
      const n = String(v.name).toLowerCase();
      const vl = String(v.lang).toLowerCase().replace(/_/g, "-");
      const want = String(tag || "").toLowerCase().replace(/_/g, "-");
      if (baseOf(vl) !== baseOf(want)) return -1;
      let s = 100;
      if (vl === want) s += 40;
      if (/natural|neural|premium|enhanced/.test(n)) s += 90;
      if (/google/.test(n)) s += 55;
      if (/online/.test(n)) s += 30;
      if (/microsoft/.test(n)) s += 12;
      if (/swara|ravi|heera|aditi|kalpana|hemant|neerja|prabhat|sharad|ananya|aarav|neel|madhur|veena/.test(n)) s += 16;
      if (/david|zira|mark|hazel/.test(n)) s -= 10;
      if (v.localService === false) s += 6;
      return s;
    }

    function isNatural(v) { return /natural|neural|premium|enhanced|google|online/i.test(String(v.name)); }

    function bestFor(tag) {
      if (!voices.length) snapshot();
      const ranked = voices
        .map((v) => ({ v, s: rank(v, tag) }))
        .filter((x) => x.s >= 0)
        .sort((a, b) => b.s - a.s);
      return ranked.length ? ranked[0].v : null;
    }

    function list() { return voices.slice(); }

    function setVoice(name) {
      S.voiceName = name || "";
      try { localStorage.setItem("mk.voice", S.voiceName); } catch (e) {}
    }

    function voiceFor(tag) {
      if (!voices.length) snapshot();
      if (S.voiceName) {
        const chosen = voices.find((v) => v.name === S.voiceName);
        if (chosen && baseOf(chosen.lang) === baseOf(tag)) return chosen;
      }
      return bestFor(tag);
    }

    function speak(text, langCode) {
      return new Promise((resolve) => {
        if (!supported || !S.voiceOn || !text) { resolve(false); return; }
        const tag = mkLang(langCode).speech;
        try { window.speechSynthesis.cancel(); } catch (e) {}
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = tag;
        const v = voiceFor(tag);
        if (v) u.voice = v;
        u.rate = 0.88;
        u.pitch = 1;
        u.volume = 1;
        let settled = false;
        const finish = (ok) => { if (settled) return; settled = true; resolve(ok); };
        u.onend = () => finish(true);
        u.onerror = () => finish(false);
        try { window.speechSynthesis.speak(u); } catch (e) { finish(false); return; }
        setTimeout(() => {
          if (settled) return;
          let speaking = false;
          try { speaking = window.speechSynthesis.speaking || window.speechSynthesis.pending; } catch (e) {}
          if (!speaking) finish(false);
        }, 1400);
        setTimeout(() => finish(true), Math.min(20000, 2600 + String(text).length * 95));
      });
    }
    function stop() { if (supported) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
    return { supported, load, speak, stop, voiceFor, bestFor, list, isNatural, setVoice, refresh, baseOf };
  })();

  const Ears = (function () {
    const SR = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
    let active = null;
    function available() { return !!SR; }
    function listen(bcp47, onPartial, maxMs, onError) {
      return new Promise((resolve) => {
        if (!SR) { resolve(""); return; }
        const rec = new SR();
        active = rec;
        let finalText = "";
        let settled = false;
        let silence = null;
        let hard = null;
        const done = (t) => {
          if (settled) return;
          settled = true;
          if (silence) clearTimeout(silence);
          if (hard) clearTimeout(hard);
          try { rec.stop(); } catch (e) {}
          if (active === rec) active = null;
          resolve(String(t || "").trim());
        };
        rec.lang = bcp47;
        rec.continuous = true;
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        rec.onresult = (e) => {
          let interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript + " ";
            else interim += r[0].transcript;
          }
          if (onPartial) onPartial((finalText + interim).trim());
          if (silence) clearTimeout(silence);
          silence = setTimeout(() => done(finalText.trim()), 1600);
        };
        rec.onerror = (e) => {
          if (onError) { try { onError(e && e.error); } catch (err) {} }
          done(finalText.trim());
        };
        rec.onend = () => done(finalText.trim());
        try { rec.start(); } catch (e) { done(""); return; }
        hard = setTimeout(() => done(finalText.trim()), maxMs || 6500);
      });
    }
    function stop() { if (active) { try { active.stop(); } catch (e) {} active = null; } }
    return { available, listen, stop };
  })();

  /* --------------------------------------------------------------- utilities */

  function askText(step) { return (step.ask && (step.ask[S.lang] || step.ask.en)) || ""; }
  function sayText(step) { return step.say ? (step.say[S.lang] || step.say.en) : ""; }

  function updateVoiceUI() {
    const r = root();
    const status = r.querySelector(".voiceStatus");
    if (status) status.textContent = S.listening ? mkT("listening", S.lang) : (S.voiceNote || "");
    const mic = r.querySelector("#mic-btn");
    if (mic) {
      mic.innerHTML = "";
      mic.append(
        document.createTextNode(S.listening ? mkT("stopListening", S.lang) : mkT("speakNow", S.lang)),
        el("br"),
        document.createTextNode(S.listening ? "रोकें" : "बोलें"),
      );
    }
  }

  function setVoiceNote(text) {
    S.voiceNote = text || "";
    updateVoiceUI();
  }

  function recErrMsg(code, step) {
    const tag = mkLang(S.lang).speech;
    switch (code) {
      case "not-allowed": case "service-not-allowed":
        return "Microphone blocked. Allow it in the address bar, then tap Speak again.";
      case "no-speech":
        return "Didn't hear anything. Tap Speak, wait a beat, then talk close to the mic.";
      case "audio-capture":
        return "No microphone found on this device. Type your answer instead.";
      case "network":
        return "Voice input could not reach the speech service — check the connection, or type instead.";
      case "language-not-supported":
        return tag + " recognition is not supported here. Type your answer instead.";
      case "aborted":
        return "Voice input stopped.";
      default:
        return "Voice input failed (" + (code || "unknown error") + "). You can type instead.";
    }
  }

  let listenToken = 0;

  function voiceTurn(step) {
    return !!(step && ["bodymap", "safety"].indexOf(step.kind) < 0);
  }

  /* Opens the recogniser and waits — for as long as it takes — for the person
     to speak. Spoken words fill the answer on screen; single-choice answers
     move on, written answers wait for Send/Confirm. */
  function startListening(step) {
    if (!voiceTurn(step)) return;
    if (!Ears.available()) {
      setVoiceNote("Voice input is unavailable here — typing always works.");
      return;
    }
    if (window.location && window.location.protocol === "file:") {
      setVoiceNote("Voice input is blocked on a local file — serve the page over http://127.0.0.1 (see serve-prototype.py), or type instead.");
      return;
    }
    const token = ++listenToken;
    Voice.stop();
    S.listening = true;
    setVoiceNote("");
    Ears.listen(mkLang(S.lang).speech, (partial) => {
      if (token !== listenToken) return;
      const ta = root().querySelector("#answer-ta");
      if (ta && (step.kind === "text" || step.kind === "multi")) ta.value = partial;
      setVoiceNote("… " + partial);
    }, 120000, (code) => {
      if (token !== listenToken) return;
      setVoiceNote(recErrMsg(code, step));
    }).then((text) => {
      if (token !== listenToken) return;
      S.listening = false;
      updateVoiceUI();
      if (text) acceptSpoken(step, text);
    });
  }

  function stopListening() {
    listenToken += 1;
    Ears.stop();
    S.listening = false;
    updateVoiceUI();
  }

  function acceptSpoken(step, text) {
    S.heard = text;
    matchSpoken(step, text);
    if (step.kind === "text") {
      step.answer.text = text;
      S.answers[step.id] = Object.assign({}, step.answer, { heard: text, by: "voice" });
      pushLog("patient", text);
      setVoiceNote("Heard — check it above, then press Send.");
      render();
      return;
    }
    if (step.kind === "multi" || step.kind === "scale") {
      S.answers[step.id] = Object.assign({}, step.answer, { heard: text, by: "voice" });
      setVoiceNote(step.kind === "multi"
        ? "Heard — check the chosen answers, then press Confirm."
        : "Heard — check the number, then press Confirm.");
      render();
      return;
    }
    if (step.kind === "cc") {
      if (step.answer.value === "yes") {
        const comp = CC_DETECT[S.bodyRegion] || CC_DETECT.general;
        pushLog("patient", text);
        S.answers.cc = { value: "yes", en: comp.en, hi: comp.hi, heard: text, by: "voice" };
        render();
        advanceSoon();
      } else {
        step.answer.value = "no";
        setVoiceNote("Heard: “" + text + "” — type your main problem below.");
        render();
      }
      return;
    }
    if (step.answer.value != null) {
      const opt = (step.options || []).find((o) => o.v === step.answer.value);
      pushLog("patient", text);
      S.answers[step.id] = Object.assign({}, step.answer, {
        en: (opt && opt.en) || step.answer.en,
        hi: (opt && (opt.hi || opt.en)) || step.answer.hi,
        heard: text, by: "voice",
      });
      render();
      advanceSoon();
    } else {
      // No match: stay on the question and let the person tap or speak again.
      // Never spin the microphone on its own — the visit waits for the person.
      setVoiceNote("Heard: “" + text + "” — tap the closest answer, or tap Speak to try again.");
      render();
    }
  }

  /* Best-effort mapping of a spoken sentence onto the prepared options; the
     spoken words themselves are always kept on the record. */
  function matchSpoken(step, text) {
    const low = " " + String(text).toLowerCase() + " ";
    const has = (re) => re.test(low);
    if (step.kind === "scale") {
      const m = low.match(/\b(10|[0-9])\b/);
      if (m) step.answer.value = Number(m[1]);
      return;
    }
    if (step.kind === "yesno") {
      if (has(/\b(yes|yeah|haan|ha|हाँ|हां|जी)\b/)) step.answer.value = "yes";
      else if (has(/\b(no|nope|nahi|nahin|नहीं|नही)\b/)) step.answer.value = "no";
      else step.answer.value = "not_sure";
      return;
    }
    if (step.kind === "cc") {
      step.answer.value = has(/\b(yes|correct|sahi|right|हाँ|सही)\b/) ? "yes" : "no";
      return;
    }
    if (step.kind === "text") { step.answer.text = text; return; }
    if (step.kind === "chips" || step.kind === "multi") {
      const hits = (step.options || []).filter((o) => {
        const words = [o.en, o.hi].filter(Boolean).join(" ").toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter((w) => w.length > 3);
        return words.some((w) => low.indexOf(w) >= 0);
      });
      if (hits.length) {
        if (step.kind === "multi") step.answer.values = hits.map((h) => h.v);
        else step.answer.value = hits[0].v;
      }
    }
  }

  function applyAnswer(step) {
    const a = step.answer || {};
    if (a.region && !S.tapped) S.bodyRegion = a.region;
    S.answers[step.id] = a;
  }

  function advanceSoon() {
    const idx = S.stepIdx;
    setTimeout(() => {
      if (S.phase === "interview" && S.stepIdx === idx) nextStep();
    }, 700);
  }

  function nextStep() {
    stopListening();
    Voice.stop();
    const step = MK_STEPS[S.stepIdx];
    if (step && step.kind === "safety") S.safetySeen = true;
    if (S.stepIdx >= MK_STEPS.length - 1) { enterDocuments(); return; }
    S.stepIdx += 1;
    runStep();
  }
  function skipStep() {
    const step = MK_STEPS[S.stepIdx];
    if (step) {
      S.answers[step.id] = { skipped: true };
      pushLog("patient", S.lang === "hi" ? "डॉक्टर से बताएँगे" : "Will tell the doctor");
    }
    nextStep();
  }

  /* -------------------------------------------------------------- chrome */

  function root() { return document.getElementById("root"); }

  function curStep() {
    return S.phase === "interview" ? (MK_STEPS[S.stepIdx] || null) : null;
  }

  function showToast(text, kind) {
    S.toastMsg = { text: text, kind: kind || "" };
    render();
    setTimeout(() => {

    }, 3600);
  }

  function pushLog(who, text, variant) {
    S.log.push({ who: who, text: text, variant: variant || "" });

  function scrollLog() {

  /* Presenter control: choose which installed voice reads the kiosk aloud. */

    });

    ]);

  function elapsed() {
    if (!S.startedAt) return "";
    const s = Math.floor((Date.now() - S.startedAt) / 1000);

  }

  function controlBar() {

      inInterview ? el("button", { class: "cbBtn", type: "button", text: "⏭ Skip step", onClick: skipStep }) : null,
      (inInterview || inReadback) ? el("button", { class: "cbBtn", type: "button", text: "⏩ Jump to summary", onClick: enterMerge }) : null,

  const MOD_SUB = {
    A: "Module A — Patient History Kiosk · रोगी इतिहास कियोस्क",

            text: S.voiceOn ? "🔊 Read-aloud on" : "🔇 Read-aloud muted",

          }),

          el("span", { class: "hdrChip" }, [el("span", { class: "dot" }), "On-device · offline-first"]),
          el("span", { class: "hdrChip", text: mkLang(S.lang).native }),

  function urgentStrip() {

  /* left progress rail */
  const RAIL_DEFS = [
    { id: "story", turns: ["bodymap", "narrative", "cc"] },
    { id: "symptoms", turns: ["socrates.site", "socrates.onset", "socrates.character", "socrates.radiation", "socrates.associations", "socrates.timing", "socrates.exacerbating", "socrates.severity"] },
    { id: "safety", turns: ["safety"] },
    { id: "history", turns: ["pmh", "meds", "allergies", "family", "social.smoke", "social.alcohol"] },
    { id: "ros", turns: ["ros.rest_breathless", "ros.palpitations", "ros.fever_cough", "ros.calf"] },
    { id: "ice", turns: ["ice.worry", "ice.expect"] },

    { id: "summary", turns: [] },

  const RAIL_LABEL = {

    symptoms: { en: "Symptom details", hi: "लक्षण विवरण" },
    safety: { en: "Safety check", hi: "सुरक्षा जाँच" },
    history: { en: "Health history", hi: "स्वास्थ्य इतिहास" },
    ros: { en: "Other symptoms", hi: "अन्य लक्षण" },
    ice: { en: "Your thoughts", hi: "आपके विचार" },

  function railStatus(def) {
    const afterInterview = ["documents", "merge", "readback", "handoff", "physician"].indexOf(S.phase) >= 0;
    if (def.id === "summary") {
      if (S.phase === "handoff" || S.phase === "physician") return "done";
      if (S.phase === "readback" || S.phase === "merge") return "current";
      return "";
    }
    if (def.id === "documents") {
      if (S.phase === "documents") return S.docsStage === "review" ? "done" : "current";
      return afterInterview ? "done" : "";
    }
    if (S.phase !== "interview") return afterInterview ? "done" : "";
    if (def.id === "safety") {
      const cur = curStep();
      if (cur && cur.id === "safety") return "current";
      if (!S.safetySeen) return "";
      return S.redFired ? "flagged" : "done";
    }
    const cur = curStep();
    const n = def.turns.filter((t) => S.answers[t]).length;
    if (cur && cur.section === def.id) return "current";
    if (n > 0) return "done";
    return "";
  }

  function rail() {

      return box;

  function render() {
    document.documentElement.lang = S.lang;

    const r = root();

    if (S.redFired && S.safetyAck && ["interview", "readback", "handoff"].indexOf(S.phase) >= 0) r.append(urgentStrip());
    const map = {
      welcome: renderWelcome, interview: renderInterview, documents: renderDocuments,
      merge: renderMerge, readback: renderReadback, handoff: renderHandoff,
      physician: renderPhysician,
    };
    (map[S.phase] || renderWelcome)(r);
    r.append(stageFoot());
    const step = curStep();
    if (step && step.kind === "safety" && S.safetyStage === "overlay" && S.redFired && !S.safetyAck) {

    }
    if (!S.spoken) r.append(el("div", { class: "soundHint", text: "Tap once anywhere to start the voice" }));
    if (S.toastMsg) r.append(el("div", { class: "toast " + S.toastMsg.kind, text: S.toastMsg.text }));
    scrollLog();
  }

  /* ------------------------------------------------------------- welcome */

  function micLabel(s) {
    return s === "granted" ? "already allowed"
      : s === "prompt" ? "will be asked on first use"
      : s === "denied" ? "blocked" : "unknown";

  function voiceCheck() {
    const isFile = !!(window.location && window.location.protocol === "file:");
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
    const voices = Voice.list();
    const hiV = voices.find((v) => Voice.baseOf(v.lang) === "hi");
    const enV = voices.find((v) => Voice.baseOf(v.lang) === "en");

    } catch (e) {}
    const row = (cls, mark, label, value, fix) => el("div", { class: "vcRow " + cls }, [
      el("span", { class: "vcMark", text: mark }),
      el("span", { class: "vcLabel", text: label }),
      el("span", { class: "vcVal" }, [
        typeof value === "string" ? document.createTextNode(value) : value,
        fix ? el("span", { class: "vcFix", text: fix }) : null,
      ]),
    ]);
    const testSound = () => {
      Voice.speak(S.lang === "hi"
        ? "नमस्ते। कियोस्क इस तरह से हर सवाल पढ़ेगा।"
        : "Hello. This is how the kiosk will read each question.", S.lang);
    };
    return el("div", { class: "voiceCheck" }, [

  async function startVisit() {
    if (S.busy) return;
    S.busy = true;
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach((t) => t.stop());
      }
    } catch (e) { /* touch-only fallback keeps working */ }
    S.busy = false;
    // Module A is captured live: clear every prepared value so nothing is
    // pre-selected and no answer is recorded until the person gives it.
    MK_STEPS.forEach((s) => { s.answer = (s.kind === "multi") ? { values: [] } : {}; });
    S.heard = "";
    S.bodyRegion = null;
    S.tapped = false;
    S.log = [];
    S.redFired = false;
    S.redHits = [];
    S.safetySeen = false;
    S.safetyStage = null;
    S.safetyAck = false;
    S.startedAt = Date.now();
    pushLog("sys", "Visit started · consent " + MK_CONSENT_REF, "sysOk");
    S.phase = "interview";
    S.stepIdx = 0;
    runStep();
  }

  const STEP_TAG = {
    bodymap: "Start · Point to the pain",
    narrative: "Step 1 · Your story",
    cc: "Step 2 · Main problem",
    "socrates.site": "SOCRATES · S — Site",
    "socrates.onset": "SOCRATES · O — Onset",
    "socrates.character": "SOCRATES · C — Character",
    "socrates.radiation": "SOCRATES · R — Radiation",

  function stepTagFor(step) {
    if (step.kind === "yesno") return "Focused review of systems";
    if (step.id === "ice.worry") return "ICE · Ideas, Concerns, Expectations";
    if (step.id === "ice.expect") return "ICE · Expectation";
    return STEP_TAG[step.id] || "Question";
  }

  function speakTextFor(primary, secondary) {
    const deva = /[\u0900-\u097F]/;
    if (deva.test(primary || "")) return primary;
    if (deva.test(secondary || "")) return secondary;
    return primary || secondary || "";
  }

  function promptBlock(step) {
    const ask = step.ask || {};
    const primary = ask[S.lang] || ask.en || "";
    const secondary = S.lang === "hi" ? (ask.en || "") : (ask.hi || "");
    const speech = speakTextFor(primary, secondary);
    return [
      el("div", { class: "stepTag", text: stepTagFor(step) }),
      el("div", { class: "prompt", role: "status", "aria-live": "polite" }, [
        document.createTextNode(primary),
        el("span", { class: "speakWrap" }, [
          el("button", {
            class: "speakBtn", type: "button", text: "[audio] Listen · सुनें",

      id: "answer-ta", rows: rows || 2,
      placeholder: S.lang === "hi" ? "जो बोलना है वह लिखिए…" : "Type what you would say out loud…",
      value: step.answer.text || "",
      onInput: (e) => { step.answer.text = e.target.value; sendBtn.disabled = !e.target.value.trim(); },
    });

      el("div", { class: "inputRow" }, [ta, micButton(step), sendBtn]),

  function renderInterview(r) {
    const step = curStep();
    if (!step) { enterDocuments(); return; }
    const card = el("div", { class: "card" });
    if (step.kind === "bodymap") card.append(bodymapBlock(step));
    else if (step.kind === "text") card.append(textBlock(step));

    else if (step.kind === "scale") card.append(scaleBlock(step));
    else if (step.kind === "chips") card.append(singleChipsBlock(step));
    else if (step.kind === "multi") card.append(multiBlock(step));

  const CC_DETECT = {
    head: { en: "headache", hi: "सिर दर्द" },
    chest: { en: "chest pain", hi: "छाती में दर्द" },
    abdomen: { en: "stomach pain", hi: "पेट दर्द" },
    back: { en: "back pain", hi: "कमर दर्द" },
    armL: { en: "arm pain", hi: "हाथ में दर्द" },
    armR: { en: "arm pain", hi: "हाथ में दर्द" },
    legL: { en: "knee / joint pain", hi: "घुटने का दर्द" },

  function singleChipsBlock(step) {
    const grid = el("div", { class: "chipGrid" }, (step.options || []).map((o) => {

      return el("button", {

  function multiBlock(step) {
    const chosen = step.answer.values || [];
    const grid = el("div", { class: "chipGrid" }, (step.options || []).map((o) => {
      const on = chosen.indexOf(o.v) >= 0;
      const dim = chosen.length > 0 && !on && (step.options || []).some((x) => x.exclusive && chosen.indexOf(x.v) >= 0);
      return el("button", {
        class: "chip" + (on ? " selected" : "") + (dim ? " selExcl" : ""), type: "button", "aria-pressed": String(on),
        onClick: () => {
          let v = (step.answer.values || []).slice();
          if (o.exclusive) v = on ? [] : [o.v];
          else {
            v = v.filter((x) => !(step.options || []).some((y) => y.v === x && y.exclusive));
            v = on ? v.filter((x) => x !== o.v) : v.concat([o.v]);
          }
          step.answer.values = v;
          render();
        },
      }, [
        el("span", { class: "cEn", text: o.en }),
        o.hi ? el("span", { class: "cHi", text: o.hi }) : null,
      ]);
    }));
    const detail = el("textarea", {
      rows: 1, placeholder: "…",
      value: step.answer.detail || "",
      onInput: (e) => { step.answer.detail = e.target.value; },

    const n = chosen.length;
    return el("div", {}, [
      ...promptBlock(step),
      grid,
      el("div", { class: "detailRow" }, [
        el("label", { text: "Add detail · विवरण जोड़ें" }),
        detail,
      ]),
      el("div", { class: "btnRow" }, [
        el("button", {
          class: "btn", type: "button", disabled: n === 0,
          text: (S.lang === "hi" ? "पुष्टि करें" : "Confirm") + " (" + n + ")",
          onClick: () => confirmMulti(step),
        }),
      ]),
      voiceStatus(),
      skipLink(),
    ]);
  }

  function confirmMulti(step) {
    const vals = step.answer.values || [];
    if (!vals.length) return;
    const opts = step.options || [];
    const en = [], hi = [];
    opts.forEach((o) => { if (vals.indexOf(o.v) >= 0) { en.push(o.en); hi.push(o.hi || o.en); } });
    let display = en.join("; ");
    const detail = (step.answer.detail || "").trim();
    if (detail) display += " — " + detail;
    const prev = S.answers[step.id] || {};
    pushLog("patient", display);
    S.answers[step.id] = {
      values: vals, en: display, hi: hi.join("; "), detail: detail || null,
      by: prev.by || "touch", heard: prev.heard || null,
    };
    nextStep();
  }

  function ccBlock(step) {
    const detected = CC_DETECT[S.bodyRegion] || null;
    const ask = (!detected || step.answer.value === "no") ? step.askOpen : step.askConfirm;
    const primary = (ask && (ask[S.lang] || ask.en)) || "";
    const secondary = S.lang === "hi" ? ((ask && ask.en) || "") : ((ask && ask.hi) || "");
    const speech = speakTextFor(primary, secondary);
    const typeBox = el("div", { style: "margin-top:16px" }, [inputRow(step, 1)]);
    const confirmRow = detected && step.answer.value !== "no" ? el("div", {}, [
      el("div", { class: "ccBox" }, [
        el("div", { class: "ccLbl", text: "MAIN PROBLEM · मुख्य समस्या" }),
        el("div", { class: "ccVal", text: S.lang === "hi" ? detected.hi : detected.en }),
        el("div", { class: "ccHi", text: S.lang === "hi" ? detected.en : detected.hi }),
      ]),
      el("div", { class: "chipGrid", style: "grid-template-columns:1fr 1fr" }, [
        el("button", {
          class: "chip", type: "button",
          onClick: () => {
            pushLog("patient", S.lang === "hi" ? detected.hi : detected.en);
            S.answers.cc = { value: "yes", en: detected.en, hi: detected.hi, by: "touch" };
            nextStep();
          },
        }, [
          el("span", { class: "cEn", text: S.lang === "hi" ? "✓ हाँ, सही है" : "✓ Yes, that is correct" }),

        ]),
        el("button", {
          class: "chip", type: "button",
          onClick: () => { step.answer.value = "no"; render(); },
        }, [
          el("span", { class: "cEn", text: S.lang === "hi" ? "नहीं — मैं बताता हूँ" : "No — let me say it" }),
          el("span", { class: "cHi", text: S.lang === "hi" ? "No — let me say it" : "नहीं — मैं बताता हूँ" }),
        ]),

    ]) : null;
    return el("div", {}, [
      el("div", { class: "stepTag", text: stepTagFor(step) }),
      el("div", { class: "prompt", role: "status", "aria-live": "polite" }, [
        document.createTextNode(primary),
        el("span", { class: "speakWrap" }, [
          el("button", { class: "speakBtn", type: "button", text: "[audio] Listen · सुनें", title: "Listen to the question", onClick: () => Voice.speak(speech, S.lang) }),
        ]),
      ]),
      secondary && secondary !== primary ? el("div", { class: "promptSub", text: secondary }) : null,
      confirmRow,
      (!detected || step.answer.value === "no") ? typeBox : null,
      voiceTag(),
    ]);

  const RF_TERMS = {
    headache: ["headache", "sir dard", "sar dard", "सिर", "माथा"],
    sudden: ["sudden", "achanak", "ekdum", "अचानक", "एकदम"],
    chest: ["chest", "seene", "chati", "छाती", "सीने"],
    breath: ["breathless", "breath", "saans", "सांस", "साँस", "dum phool"],
    stroke: ["one side", "ek taraf", "एक तर", "falij", "फालिज", "paralysis", "पक्षाघात", "slurr", "lisdar", "लिसडर", "droop", "munh teda", "मुंह टेढ़ा", "आधा शरीर"],
    concern: ["sweat", "pasina", "पसीना", "faint", "behosh", "बेहोश", "vomit", "उल्टी", "ulti", "मतली", "nausea", "chakkar", "चक्कर", "dizzy"],
  };

  function answerCorpus() {
    const bits = [];
    Object.keys(S.answers).forEach((k) => {
      const a = S.answers[k];
      if (!a || typeof a !== "object") return;
      ["heard", "text", "en", "hi", "detail"].forEach((f) => { if (a[f]) bits.push(String(a[f])); });
    });
    if (S.bodyRegion === "chest") bits.push("chest pain");
    if (S.bodyRegion === "head") bits.push("headache");
    const sev = S.answers["socrates.severity"];
    if (sev && typeof sev.value === "number") bits.push("severity " + sev.value);
    return bits.join(" \n ").toLowerCase();
  }

  /* Deterministic red-flag check over the answers actually given — the same
     four-rule shape as the capture contract, evaluated on this machine. */
  function evalRedFlags() {
    const corpus = answerCorpus();
    const has = (terms) => terms.filter((t) => corpus.indexOf(t) >= 0);
    const sev = S.answers["socrates.severity"];
    const sevN = sev && typeof sev.value === "number" ? sev.value : null;
    const out = [];
    const h1 = has(RF_TERMS.headache), s1 = has(RF_TERMS.sudden);
    if (h1.length && s1.length) out.push({ id: "RF-1", evidence: h1.concat(s1).slice(0, 3) });
    const c2 = has(RF_TERMS.chest), b2 = has(RF_TERMS.breath);
    if (c2.length && b2.length) out.push({ id: "RF-2", evidence: c2.concat(b2).slice(0, 3) });
    const st = has(RF_TERMS.stroke);
    if (st.length) out.push({ id: "RF-3", evidence: st.slice(0, 3) });
    const cc = has(RF_TERMS.concern);
    if (sevN != null && sevN >= 8 && cc.length) out.push({ id: "RF-4", evidence: ["severity " + sevN].concat(cc.slice(0, 2)) });
    return out;
  }

  async function runStep() {
    const step = MK_STEPS[S.stepIdx];
    if (!step) { enterDocuments(); return; }
    if (step.kind === "bodymap") { S.tapped = false; S.bodyRegion = null; }
    S.heard = "";
    S.voiceNote = "";
    if (step.kind === "safety") { render(); await runSafety(); return; }
    const ask = step.ask || {};
    const primary = ask[S.lang] || ask.en || "";
    const secondary = S.lang === "hi" ? (ask.en || "") : (ask.hi || "");
    pushLog("kiosk", secondary && secondary !== primary ? primary + " · " + secondary : primary);
    render();
    await Voice.speak(speakTextFor(primary, secondary), S.lang);
    S.spoken = true;
    // open the microphone and wait for the person — no timer moves the visit on
    startListening(step);
  }

    S.safetySeen = true;

    pushLog("kiosk", S.lang === "hi" ? "चेतावनी के संकेत जाँच रहे हैं…" : "Checking for warning signs…");

    S.redHits = evalRedFlags();
    S.redFired = S.redHits.length > 0;
    if (S.redFired) {
      S.safetyStage = "overlay";
      pushLog("sys", "Warning sign found — " + S.redHits.map((h) => h.id).join(", "), "sysRed");

    S.docsStage = "scan";
    S.extracted = 0;
    render();
    await Voice.speak("Reading the papers now. This stays on this machine.", S.lang);
    const pages = S.uploads.length ? S.uploads.length : MK_PAPERS.length;
    for (let i = 0; i < pages; i++) {
      if (S.phase !== "documents" || S.docsStage !== "scan") return;
      S.extracted = i + 1;
      render();
      await wait(1700);

    S.docsStage = "review";
    S.extracted = 0;
    pushLog("sys", "Papers read — prescription, blood report, ECG, one handwritten slip.", "sysOk");
    render();

      S.redFired ? el("div", { class: "sumFlagBanner" }, [
        el("span", { class: "fbTag", text: "URGENT FLAG" }),
        document.createTextNode(S.redHits.map((h) => h.id + " ").join("") + "— " +
          ((MK_RULES.find((x) => x.id === (S.redHits[0] || {}).id) || {}).en || "") +
          ". Staff acknowledged · प्राथमिकता कतार में"),
      ]) : null,
      ...RB_SECTIONS.map((sec) => el("div", { class: "sumSection" }, [
        el("h3", {}, [
          document.createTextNode(sec.title.en + " "),
          el("span", { class: "ssHi", text: "· " + sec.title.hi }),
        ]),
        ...sec.ids.map((i) => {
          const l = lines[i];
          const st = (S.rb || {})[i];
          return el("div", { class: "sumRow" }, [
            el("div", { class: "srLab", text: l.field }),
            el("div", { class: "srVal" }, [el("div", { class: "vTxt", text: l.text })]),
            el("div", { class: "srSide" }, [
              el("span", { class: "badge cap", text: st === "no" ? "to change · बदलें" : "noted · दर्ज" }),
              el("button", {
                class: "chgBtn", type: "button", text: "✓ " + mkT("correct", S.lang),
                onClick: () => setReadback(i, "yes"),
              }),
              el("button", {
                class: "chgBtn", type: "button", text: "✗ " + mkT("change", S.lang),
                onClick: () => { setReadback(i, "no"); Voice.speak("Please tell the doctor what to change.", S.lang); },
              }),
            ]),
          ]);
        }),
      ])),
      el("div", { class: "sumConfirm" }, [
        el("div", { class: "scMsg" }, [
          document.createTextNode(S.lang === "hi" ? "सब जाँच लिया?" : "Checked everything?"),
          el("span", { class: "hi", text: "पुष्टि करें — सारांश डॉक्टर की स्क्रीन पर जाएगा" }),
        ]),
        el("button", {
          class: "btn big", type: "button", style: "background:#fff;color:var(--teal-dd)",
          text: "✓ Confirm — send to doctor's screen · भेजें",
          onClick: enterHandoff,
        }),
      ]),
    ]);
    r.append(wrap);
  }

  /* ------------------------------------------------------------ handoff */

  function enterHandoff() {
    S.phase = "handoff";
    pushLog("sys", S.redFired ? "Confirmed — sent to priority triage." : "Confirmed — sent to the doctor's screen.", "sysOk");
    render();
    Voice.speak("Thank you. Your summary is ready for the doctor.", S.lang);
  }

  function renderHandoff(r) {
    const C = mkConsent(S.lang);
    const rule0 = MK_RULES.find((x) => x.id === ((S.redHits[0] || {}).id || "")) || {};
    const card = el("div", { class: "card" }, [
      el("div", { class: "stepTag", text: "Module D · Consent-backed hand-off · सहमति" }),
      el("div", { class: "prompt", text: "Done. Your summary is with the doctor's screen." }),
      S.redFired
        ? el("div", { class: "alertInstruction" }, [
            el("div", { class: "aiBig", text: "This visit is flagged as PRIORITY TRIAGE — " + (rule0[S.lang] || rule0.en || "warning sign") + ". Please go to the triage desk now." }),
            el("div", { class: "aiHi", text: "यह विज़िट प्राथमिकता कतार में है — कृपया सहायता डेस्क पर जाइए।" }),
            el("div", { class: "aiMeta" }, [
              el("span", { class: "aiPill", text: S.redHits.map((h) => h.id).join(" + ") + " · priority triage" }),
              el("span", { class: "aiPill", text: "Consent " + C.artefact }),
            ]),
          ])
        : el("div", { class: "safetyOk", text: S.lang === "hi" ? "कृपया बैठिए। डॉक्टर जल्द ही बुलाएँगे।" : "Please take a seat. The doctor will see you shortly." }),
      el("p", { style: "margin-top:14px;color:var(--muted)", text: "Show this code if asked at the desk:" }),
      el("div", { class: "codeBig", text: "MK-2F41" }),
      el("dl", { class: "kv" }, [
        el("dt", { text: "Queue" }), el("dd", { text: S.redFired ? "Priority triage" : "Routine OPD" }),
        el("dt", { text: "Patient" }), el("dd", { text: MK_PATIENT.name + " · " + MK_PATIENT.age + " / " + MK_PATIENT.sex }),
        el("dt", { text: "ABHA" }), el("dd", { text: MK_PATIENT.abha }),
        el("dt", { text: C.ref }), el("dd", { style: "font-family:ui-monospace,monospace", text: C.artefact }),
        el("dt", { text: "Papers" }), el("dd", { text: "4 read · 1 handwritten flagged for the doctor" }),
        el("dt", { text: "Shared with" }), el("dd", { text: "Only the treating doctor, for this visit" }),
      ]),
      el("div", { class: "safetyNote", text: "Your voice was never recorded — only the words were read, and they are gone now." }),
      el("div", { class: "btnRow" }, [
        el("button", { class: "btn big", type: "button", text: "Open physician view · डॉक्टर स्क्रीन", onClick: enterPhysician }),
      ]),
    ]);
    r.append(card);
  }

  /* ----------------------------------------------------------- physician */

  function enterPhysician() {
    S.phase = "physician";
    pushLog("sys", "Summary handed to the physician screen.", "sysOk");
    render();
  }

  function hoRow(label, value, src) {
    return el("div", { class: "hoRow" }, [
      el("span", { class: "hK", text: label }),
      el("span", { class: "hV", text: value }),
      el("span", { class: "hSrc", text: src || "—" }),
    ]);
  }

  function renderPhysician(r) {
    const comp = CC_DETECT[S.bodyRegion] || CC_DETECT.general;
    const hits = S.redHits || [];
    const queuePri = S.redFired;
    const wrap = el("div", { class: "hoWrap" }, [
      el("div", { class: "sumSection" }, [
        el("h3", {}, [
          document.createTextNode("Today's queue "),
          el("span", { class: "ssHi", text: "· आज की कतार" }),
        ]),
        ...MK_WORKLIST.map((w, i) => el("button", {
          class: "workItem", type: "button", "aria-current": String(i === 0),
        }, [
          el("div", {}, [el("strong", { text: w.name + " · " + w.age })]),
          el("div", { style: "color:var(--muted)", text: w.problem }),
          el("div", { style: "margin-top:6px" }, [
            el("span", {
              class: "hoPill " + (i === 0 ? (queuePri ? "pri" : "ok") : (w.flag ? "pri" : "ok")),
              text: i === 0 ? (queuePri ? "PRIORITY TRIAGE" : "ROUTINE OPD") : w.queue.toUpperCase(),
            }),
          ]),
        ])),
        el("p", { style: "margin-top:12px;font-size:.8rem;color:var(--muted)", text: "Machine-generated history and paper extracts carry provenance. Assessment and plan are physician-only." }),
      ]),
      el("div", { class: "hoSheet" }, [
        el("div", { class: "hoHead" }, [
          el("div", { class: "hoT", text: "Physician summary — pre-consultation record" }),
          el("div", { class: "hoMeta" }, [
            el("span", { class: "hoPill", text: MK_PATIENT.name + " · " + MK_PATIENT.age + " / " + MK_PATIENT.sex }),
            el("span", { class: "hoPill", text: "session MK-2F41 · consent " + MK_CONSENT_REF }),
            el("span", { class: "hoPill", text: "language: " + mkLang(S.lang).native }),
            el("span", { class: "hoPill " + (queuePri ? "pri" : "ok"), text: queuePri ? "QUEUED: PRIORITY TRIAGE" : "QUEUED: ROUTINE OPD" }),
            el("span", { class: "hoPill", text: "captured on-device · offline" }),
          ]),
        ]),
        queuePri
          ? el("div", { class: "hoBanner", text: "⚠ URGENT FLAG — " + hits.map((h) => h.id).join(", ") + " matched at the safety check. Evidence: " + hits.map((h) => h.id + " («" + (h.evidence || []).join("», «") + "»)").join(" · ") + ". Staff acknowledged." })
          : el("div", { class: "hoBanner", style: "background:var(--ok-bg);border-color:#BCE3C9;color:var(--ok)", text: "Safety check: 4 fixed rules checked — none matched. Routine queue." }),
        el("div", { class: "hoBody" }, [
          el("div", { class: "hoSec" }, [
            el("h4", { text: "Presenting problem" }),
            hoRow("Main problem", S.lang === "hi" ? comp.hi : comp.en, "touch"),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "S — Subjective (from the patient's own words)" }),
            ...MK_SOAP.s.map((x) => hoRow(x.prov, x.text, "voice")),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "O — Objective (papers + capture)" }),
            ...MK_SOAP.o.map((x) => hoRow(x.prov, x.text, "document")),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "Medicines — reconciled" }),
            ...MK_MED_MERGE.map((m) => hoRow(m.conflict ? "verify" : "agreed", m.name + " — source: " + m.source, m.conflict ? "verify" : "agreed")),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "Paper extracts" }),
            ...MK_EXTRACTION.labs.map((l) => hoRow(l.name, l.value + "  (reference " + l.range + ")", l.prov)),
            hoRow("ECG", "T-wave inversion V4–V6, ST depression V5–V6 — ischaemic changes, correlate", "doc:ecg1"),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "Assessment & plan — physician only" }),
            el("div", { class: "locked" }, [
              el("span", { class: "lkTag", text: "Locked · केवल डॉक्टर" }),
              el("div", {}, [
                el("b", { text: "The kiosk never diagnoses or recommends treatment. " }),
                "Assessment and plan are completed by the physician at consultation. This handoff ends at the structured history.",
              ]),
            ]),
            el("div", { class: "detailRow" }, [
              el("label", { text: "Physician's assessment and plan…" }),
              el("textarea", { rows: 3 }),
            ]),
          ]),
          el("div", { class: "hoSec" }, [
            el("h4", { text: "FHIR bundle — hospital system / ABDM" }),
            el("dl", { class: "kv" }, [
              el("dt", { text: "Profile" }), el("dd", { text: MK_FHIR.profile }),
              el("dt", { text: "Type" }), el("dd", { text: MK_FHIR.snomed }),
              el("dt", { text: "Sections" }), el("dd", { text: MK_FHIR.sections }),
              el("dt", { text: "Resources" }), el("dd", { text: MK_FHIR.counts }),
              el("dt", { text: "Attestation" }), el("dd", { text: MK_FHIR.attester }),
            ]),
            el("pre", { class: "fhirBlock", text:
`{
  "resourceType": "Bundle",
  "type": "document",
  "identifier": { "value": "MK-2F41" },
  "timestamp": "2026-09-17T10:42:00+05:30",
  "meta": { "profile": ["https://nrces.in/ndhm/fhir/r4/StructureDefinition/OPConsultRecord"] },
  "entry": [
    { "resource": { "resourceType": "Patient", "name": "Ramesh Kumar", "gender": "male", "birthDate": "1972" } },
    { "resource": { "resourceType": "Observation", "code": "HbA1c", "valueQuantity": 8.4 } },
    { "resource": { "resourceType": "MedicationRequest", "medication": "Telmisartan 40 mg" } },
    { "resource": { "resourceType": "Consent", "id": "CM-2026-09-17-8F2A41" } }
  ]
}` }),
          ]),
        ]),
        el("div", { class: "hoFoot", text: "HistoryBundle · handoff MK-2F41-H1 · captured on-device, queued locally (offline-first) · consent " + MK_CONSENT_REF + " · ABHA " + MK_PATIENT.abha }),
      ]),
      el("div", { class: "hoActions" }, [
        el("button", { class: "btn ghost", type: "button", text: "← Back to patient summary", onClick: () => { S.phase = "readback"; render(); } }),
        el("button", { class: "btn ghost", type: "button", text: "↺ New patient", onClick: () => location.reload() }),
      ]),
    ]);
    r.append(wrap);
  }

  /* ---------------------------------------------------------------- boot */

  function installUnlock() {
    const handler = () => {
      if (S.spoken || S.unlocking) return;
      S.unlocking = true;
      Voice.speak(mkLang(S.lang).greet + ". " + mkT("tagline", S.lang), S.lang).then((ok) => {
        S.unlocking = false;
        if (ok) { S.spoken = true; render(); }
      });
    };
    ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, handler, { passive: true }));
  }

  function boot() {
    Voice.load(() => {
      if (!S.voiceName) {
        const best = Voice.bestFor(mkLang(S.lang).speech);
        if (best) Voice.setVoice(best.name);
      }
      render();
    });
    render();
    installUnlock();
    setInterval(() => {
      const t = root().querySelector(".cbTimer");
      if (t && S.startedAt) t.textContent = elapsed();
    }, 1000);
    setTimeout(() => {
      Voice.speak(mkLang(S.lang).greet + ". " + mkT("tagline", S.lang), S.lang).then((ok) => {
        if (ok) { S.spoken = true; render(); }
      });
    }, 500);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
